        body { font-family: 'Outfit', sans-serif; background-color: #f8fafc; color: #1e293b; margin: 0; overflow: hidden; }
        .brand { font-family: 'Fredoka', sans-serif; }
        .hide-scroll::-webkit-scrollbar { display: none; }
        .loader { border: 4px solid #e2e8f0; border-top: 4px solid #6366f1; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .anim-fade { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        
        /* Renkli vurgular */
        .readable-text strong { color: #4f46e5; font-weight: 800; }
        .readable-text em { background-color: #fef08a; color: #854d0e; font-style: normal; padding: 0 4px; border-radius: 4px; font-weight: 600; }
        .readable-text ul { list-style-type: disc; padding-left: 1.5rem; margin-bottom: 1rem; }
        .readable-text h3 { color: #1e293b; font-size: 1.25rem; font-weight: 800; margin-top: 1.5rem; margin-bottom: 0.5rem; border-bottom: 2px solid #e2e8f0; padding-bottom: 0.25rem; }

        .transform-style-3d { transform-style: preserve-3d; }
        .backface-hidden { backface-visibility: hidden; }

        const INSTRUCTORS = {
            'Tarih': ['Ramazan Yetgin', 'Aydın Yüce', 'Mehmet Celal Özyıldız'],
            'Coğrafya': ['Bayram Meral', 'Engin Eraydın'],
            'Vatandaşlık': ['Emrah Vahap Özkaraca'],
            'Matematik': ['İlyas Güneş'],
            'Eğitim': ['Metin Şar', 'Bülent Tanık', 'Cüneyt İltuş', 'Fatih Genç'],
            'ÖABT': ['Hilal Hoca', 'Okul Öncesi ÖABT TV', 'Sultan Hoca', 'Murat Sakin']
        };

        const Icon = ({ name, size=20, className="" }) => {
            useEffect(() => { if(window.lucide) window.lucide.createIcons(); });
            return <i data-lucide={name} className={className} style={{ width: size, height: size }}></i>;
        };

        const callGoogle = async (apiKey, modelName, prompt, type = 'json') => {
            const url = `https://generativelanguage.googleapis.com/v1beta/models/${modelName}:generateContent?key=${apiKey}`;
            
            const requestBody = {
                contents: [{ parts: [{ text: prompt }] }]
            };

            if (type === 'json') {
                requestBody.generationConfig = { responseMimeType: "application/json" };
            }

            try {
                const response = await fetch(url, { 
                    method: 'POST', 
                    headers: { 'Content-Type': 'application/json' }, 
                    body: JSON.stringify(requestBody) 
                });
                
                const data = await response.json();
                if (data.error) throw new Error(data.error.message);
                
                let text = data.candidates?.[0]?.content?.parts?.[0]?.text;
                if (!text) throw new Error("Cevap boş.");
                
                if (type === 'html') return text;
                
                text = text.replace(/```json/g, '').replace(/```/g, '').trim();
                const s = text.indexOf('['); const e = text.lastIndexOf(']');
                if (s !== -1 && e !== -1) text = text.substring(s, e+1);
                
                return JSON.parse(text);
            } catch (e) { 
                console.error(e); 
                throw e; 
            }
        };

        // --- COMPONENTS ---

        const Dashboard = ({ apiKey, setApiKey, modelName, setModelName, changeView, daysLeft, openNotebook }) => {
            const [keyInput, setKeyInput] = useState(apiKey || "");
            const [modelInput, setModelInput] = useState(modelName || "gemini-2.5-flash-preview-09-2025");

            const saveKey = async () => { 
                if(!keyInput.trim() || !modelInput.trim()) return alert("Lütfen anahtarı ve modeli eksiksiz girin!");
                
                setKeyStatus('checking');
                try {
                    await callGoogle(keyInput.trim(), modelInput.trim(), "Merhaba", "html");
                    
                    localStorage.setItem("baris_key", keyInput.trim()); 
                    localStorage.setItem("baris_model", modelInput.trim()); 
                    setApiKey(keyInput.trim()); 
                    setModelName(modelInput.trim());
                    setKeyStatus('valid');

                    setKeyStatus('invalid');
                    alert("Anahtar veya Model hatalı! ❌");
                }

            const getBorderColor = () => {
                if(keyStatus === 'valid') return 'border-emerald-500 bg-emerald-50';
                if(keyStatus === 'invalid') return 'border-red-500 bg-red-50';
                if(keyStatus === 'checking') return 'border-yellow-500 bg-yellow-50';
                return 'border-orange-200 bg-orange-50';

            return (

                    </div>

                            </div>

                        </div>
                        
                        {/* ANAHTAR VE MODEL GİRİŞİ */}

                                        <Icon name="settings"/> 
                                        {keyStatus === 'invalid' ? <span className="text-red-600">Hatalı Giriş!</span> : 'SİSTEM AYARLARI'}
                                    </div>
                                    <div className="flex flex-col gap-2">
                                        <input 
                                            value={keyInput} 
                                            onChange={e=>setKeyInput(e.target.value)} 
                                            className="w-full p-3 bg-white border-2 border-slate-200 rounded-xl font-mono text-sm outline-none focus:border-indigo-500 transition shadow-inner" 
                                            placeholder="Google API Anahtarı (AIzaSy...)"
                                            disabled={keyStatus === 'checking'}
                                        />
                                        <div className="flex gap-2">
                                            <input 
                                                value={modelInput} 
                                                onChange={e=>setModelInput(e.target.value)} 
                                                className="flex-1 p-3 bg-white border-2 border-slate-200 rounded-xl font-mono text-xs outline-none focus:border-indigo-500 transition shadow-inner" 
                                                placeholder="Model Adı"

        const Syllabus = ({ apiKey, modelName, goBack, onAction }) => {

                                                <button onClick={()=>onAction('card',t)} className="bg-white border-2 border-purple-200 text-purple-700 py-3 rounded-xl font-bold flex items-center justify-center gap-2 hover:bg-purple-500 hover:text-white transition"><Icon name="layers" size={18}/> KART</button>

                                                <button onClick={()=>onAction('video',t)} className="col-span-2 md:col-span-4 bg-red-50 text-red-600 py-2 rounded-xl text-sm font-bold border border-red-200 flex items-center justify-center gap-2 hover:bg-red-500 hover:text-white transition"><Icon name="youtube" size={16}/> Konu Anlatım Videoları</button>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            );
        };

        const SmartNotebook = ({ apiKey, modelName, close }) => {
            const [notes, setNotes] = useState(localStorage.getItem('baris_notebook') || "");
            const [processing, setProcessing] = useState(false);
            const [quizFromNotes, setQuizFromNotes] = useState(null);
            
            const handleSave = (val) => { setNotes(val); localStorage.setItem('baris_notebook', val); };
            
            const polish = async () => { 
                if(!notes.trim()) return; setProcessing(true); 
                try { 
                    const res = await callGoogle(apiKey, modelName, `Düzelt:\n${notes}`, 'html'); 
                    handleSave(res.replace(/<[^>]*>?/gm, '')); 
                    alert("Düzenlendi!"); 
                } catch(e){} finally { setProcessing(false); } 
            };
            
            const genQuiz = async () => { 
                if(!notes.trim()) return; 
                setProcessing(true); 
                try { 
                    const prompt = `Metin: "${notes}". Bu metinden 5 adet çoktan seçmeli soru hazırla. Format: JSON Array olarak şu yapıda olsun: [{"q":"Soru","opts":["A","B","C","D","E"],"ans":0,"exp":"Açıklama"}]. Sadece JSON ver.`;
                    const res = await callGoogle(apiKey, modelName, prompt, 'json'); 
                    setQuizFromNotes(res); 
                } catch(e){ alert("Hata oluştu."); } finally { setProcessing(false); } 
            };
            
            if(quizFromNotes) return <div className="fixed inset-0 z-[90] bg-white"><Quiz questions={quizFromNotes} goBack={()=>setQuizFromNotes(null)} addToErrors={()=>{}} isNotebook={true}/></div>;
            
            return (
                <div className="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4 backdrop-blur-sm anim-fade" onClick={close}>
                    <div className="bg-white w-full max-w-3xl h-[85vh] rounded-3xl shadow-2xl flex flex-col overflow-hidden" onClick={e=>e.stopPropagation()}>
                        <div className="p-4 bg-amber-400 text-amber-950 font-bold flex justify-between items-center">
                            <span className="flex items-center gap-2"><Icon name="edit-3"/> Not Defterim</span>
                            <button onClick={close}><Icon name="x"/></button>
                        </div>
                        <textarea value={notes} onChange={e=>handleSave(e.target.value)} className="flex-1 p-6 bg-amber-50 resize-none outline-none text-lg text-slate-700 leading-relaxed font-medium" placeholder="Buraya yaz..."></textarea>
                        <div className="p-3 bg-white border-t flex gap-2">
                            <button onClick={polish} disabled={processing} className="flex-1 bg-indigo-100 text-indigo-700 py-3 rounded-xl font-bold flex items-center justify-center gap-2"><Icon name="wand-2"/> Düzenle</button>
                            <button onClick={genQuiz} disabled={processing} className="flex-1 bg-emerald-100 text-emerald-700 py-3 rounded-xl font-bold flex items-center justify-center gap-2"><Icon name="brain-circuit"/> Soru Üret</button>
                        </div>
                    </div>
                </div>
            );
        };

        const InfoModal = ({ data, close }) => (
            <div className="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4 backdrop-blur-sm anim-fade" onClick={close}>
                <div className="bg-white w-full max-w-2xl max-h-[85vh] rounded-3xl p-8 shadow-2xl overflow-y-auto relative" onClick={e=>e.stopPropagation()}>
                    <button onClick={close} className="absolute top-4 right-4 bg-slate-100 p-2 rounded-full hover:bg-slate-200"><Icon name="x"/></button>
                    <h2 className="text-2xl font-black mb-6 text-indigo-700 border-b pb-2">{data.title}</h2>
                    <div className="prose prose-lg prose-slate readable-text" dangerouslySetInnerHTML={{__html: data.content}}></div>
                </div>
            </div>
        );

        const TeacherSelectModal = ({ topic, close }) => {
            const cat = topic.includes('Tarih')?'Tarih':topic.includes('Coğrafya')?'Coğrafya':topic.includes('Vatandaşlık')?'Vatandaşlık':topic.includes('Matematik')?'Matematik':topic.includes('Gelişim')||topic.includes('Öğrenme')||topic.includes('Rehberlik')?'Eğitim':'ÖABT';
            return (
                <div className="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4 backdrop-blur-sm anim-fade" onClick={close}>
                    <div className="bg-white w-full max-w-sm rounded-3xl p-6 shadow-2xl" onClick={e=>e.stopPropagation()}>
                        <h3 className="font-bold text-xl mb-4 text-red-600 flex items-center gap-2"><Icon name="youtube"/> Hoca Seç</h3>
                        <div className="space-y-2">
                            {INSTRUCTORS[cat]?.map(h=><button key={h} onClick={()=>window.open(`https://www.youtube.com/results?search_query=${encodeURIComponent(h+" "+topic)}`,'_blank')} className="w-full p-4 bg-slate-50 hover:bg-red-50 text-left rounded-xl font-bold text-slate-700 hover:text-red-600 transition border border-slate-100">{h}</button>)}
                            <button onClick={()=>window.open(`https://www.youtube.com/results?search_query=KPSS+${encodeURIComponent(topic)}`,'_blank')} className="w-full p-4 border-2 border-dashed border-slate-300 text-slate-400 font-bold rounded-xl">Genel Arama</button>
                        </div>
                        <button onClick={close} className="w-full mt-6 bg-slate-100 py-3 rounded-xl font-bold text-slate-500">Kapat</button>
                    </div>
                </div>
            );
        };

        const TrialSetup = ({ goBack, startTrial }) => {
            const [config, setConfig] = useState({ type: 'OABT', count: 20 });
            return (
                <div className="h-full flex flex-col justify-center p-6 bg-slate-50 anim-fade">
                    <button onClick={goBack} className="absolute top-6 left-6 bg-white p-3 rounded-full shadow"><Icon name="arrow-left"/></button>
                    <div className="bg-white p-10 rounded-[2.5rem] shadow-2xl max-w-lg mx-auto w-full border border-slate-100">
                        <div className="text-center mb-8"><h2 className="text-3xl font-black text-slate-800">Deneme Oluştur</h2></div>
                        <div className="space-y-3 mb-8">{[{id:'OABT', l:'ÖABT Alan'}, {id:'AGS', l:'AGS Genel'}, {id:'EGITIM', l:'Eğitim Bil.'}].map(opt=><button key={opt.id} onClick={()=>setConfig({...config, type:opt.id})} className={`w-full p-5 rounded-2xl text-left font-bold transition border-2 ${config.type===opt.id ? 'border-indigo-500 bg-indigo-50 text-indigo-700' : 'border-slate-100 text-slate-500'}`}>{opt.l}</button>)}</div>
                        <div className="flex justify-between gap-3 mb-8">{[10, 20, 30, 50].map(n=><button key={n} onClick={()=>setConfig({...config, count:n})} className={`flex-1 py-4 rounded-xl font-bold transition ${config.count===n?'bg-emerald-500 text-white shadow-lg':'bg-slate-100 text-slate-400'}`}>{n}</button>)}</div>
                        <button onClick={()=>startTrial(config)} className="w-full bg-indigo-600 text-white py-5 rounded-2xl font-bold text-xl shadow-xl hover:bg-indigo-700 transition active:scale-95">BAŞLAT</button>
                    </div>
                </div>
            );
        };

        const Quiz = ({ questions, goBack, addToErrors, isNotebook }) => {
            const [idx, setIdx] = useState(0);
            const [show, setShow] = useState(false);
            const [score, setScore] = useState(0);
            const q = questions[idx];
            
            const handleAns = (i) => { 
                if(show) return; 
                setShow(true); 
                if(i===q.ans) setScore(score+1); 
                else addToErrors({q:q.q, w:q.opts[i], r:q.opts[q.ans], e:q.exp, t: isNotebook?"Defter":"Deneme"}); 
            };
            
            return (
                <div className="h-full flex flex-col bg-slate-50 p-6 anim-fade">
                    <div className="flex justify-between items-center mb-6"><button onClick={goBack} className="text-slate-400 font-bold">Çıkış</button><div className="bg-white px-4 py-2 rounded-full font-bold shadow-sm text-indigo-600">{idx+1}/{questions.length}</div></div>
                    <div className="flex-1 overflow-y-auto"><div className="bg-white p-8 rounded-3xl shadow-md border border-slate-100 mb-6"><p className="font-bold text-xl text-slate-800 leading-relaxed">{q.q}</p></div><div className="space-y-4">{q.opts.map((o,i)=><button key={i} onClick={()=>handleAns(i)} disabled={show} className={`w-full text-left p-5 rounded-2xl border-2 font-medium text-lg transition ${show?(i===q.ans?'border-emerald-500 bg-emerald-50 text-emerald-800':i!==q.ans&&'opacity-50'):'border-white bg-white hover:border-indigo-200'}`}>{o}</button>)}</div>{show && <div className="mt-8 p-6 bg-indigo-50 border border-indigo-100 rounded-3xl text-indigo-900 font-medium">{q.exp}</div>}</div>
                    {show && <button onClick={()=>{if(idx<questions.length-1){setIdx(idx+1);setShow(false)}else{alert(`Sınav Bitti! Puan: ${score}`);goBack()}}} className="w-full bg-indigo-600 text-white py-4 rounded-2xl font-bold mt-4 shadow-lg text-lg">İleri</button>}
                </div>
            );
        };

        const Flashcards = ({ cards, goBack }) => {
            const [idx, setIdx] = useState(0);
            const [flipped, setFlipped] = useState(false);
            return (
                <div className="h-full flex flex-col bg-slate-100 p-6 anim-fade">
                    <div className="flex justify-between items-center mb-8"><button onClick={goBack} className="p-3 bg-white rounded-full shadow"><Icon name="x"/></button><span className="font-bold text-indigo-600 bg-white px-4 py-2 rounded-full shadow">{idx+1}/{cards.length}</span></div>
                    <div className="flex-1 w-full max-w-md mx-auto perspective-1000 mb-8" onClick={()=>setFlipped(!flipped)}><div className={`relative w-full h-full transition-transform duration-700 transform-style-3d cursor-pointer ${flipped?'rotate-y-180':''}`}><div className="absolute w-full h-full backface-hidden bg-white rounded-[2rem] shadow-2xl flex flex-col items-center justify-center p-10 border-b-8 border-indigo-500"><span className="text-xs font-black text-slate-300 uppercase tracking-widest mb-6">SORU</span><div className="text-3xl font-bold text-center text-slate-800">{cards[idx].front}</div></div><div className="absolute w-full h-full backface-hidden rotate-y-180 bg-gradient-to-br from-indigo-600 to-purple-700 text-white rounded-[2rem] shadow-2xl flex flex-col items-center justify-center p-10"><span className="text-xs font-black text-indigo-200 uppercase tracking-widest mb-6">CEVAP</span><div className="text-2xl font-medium text-center leading-relaxed">{cards[idx].back}</div></div></div></div>
                    <div className="flex gap-4 max-w-md mx-auto w-full"><button onClick={()=>{setIdx(Math.max(0,idx-1));setFlipped(false)}} disabled={idx===0} className="flex-1 bg-white py-4 rounded-2xl font-bold">Geri</button><button onClick={()=>{setIdx(Math.min(cards.length-1,idx+1));setFlipped(false)}} disabled={idx===cards.length-1} className="flex-1 bg-indigo-600 text-white py-4 rounded-2xl font-bold">İleri</button></div>
                </div>
            );
        };

        // YENİ ÖZELLİK: Pomodoro Çalışma Sayacı
        const Pomodoro = ({ goBack }) => {
            const [timeLeft, setTimeLeft] = useState(25 * 60);
            const [isActive, setIsActive] = useState(false);
            const [mode, setMode] = useState('work'); 

            useEffect(() => {
                let interval = null;
                if (isActive && timeLeft > 0) {
                    interval = setInterval(() => setTimeLeft(timeLeft - 1), 1000);
                } else if (timeLeft === 0 && isActive) {
                    setIsActive(false);
                    alert(mode === 'work' ? 'Harika çalıştın! Şimdi mola zamanı.' : 'Mola bitti! Çalışmaya geri dönelim.');
                    if(mode === 'work') { setMode('break'); setTimeLeft(5 * 60); }
                    else { setMode('work'); setTimeLeft(25 * 60); }
                }
                return () => clearInterval(interval);
            }, [isActive, timeLeft, mode]);

            const toggle = () => setIsActive(!isActive);
            const reset = () => { setIsActive(false); setTimeLeft(mode === 'work' ? 25 * 60 : 5 * 60); };

            const mins = Math.floor(timeLeft / 60);
            const secs = timeLeft % 60;

            return (
                <div className="h-full flex flex-col items-center justify-center p-6 bg-slate-50 anim-fade relative">
                    <button onClick={goBack} className="absolute top-6 left-6 bg-white p-3 rounded-full shadow"><Icon name="arrow-left"/></button>
                    <div className="bg-white p-10 rounded-[3rem] shadow-2xl text-center max-w-sm w-full border-4 border-rose-100">
                        <Icon name="timer" size={48} className="mx-auto mb-4 text-rose-500" />
                        <h2 className="text-3xl font-black text-slate-800 mb-8">{mode === 'work' ? 'ODAK ZAMANI' : 'MOLA ZAMANI'}</h2>
                        <div className="text-7xl font-black text-rose-600 mb-8 brand">
                            {mins.toString().padStart(2, '0')}:{secs.toString().padStart(2, '0')}
                        </div>
                        <div className="flex gap-4">
                            <button onClick={toggle} className="flex-1 bg-rose-500 text-white py-4 rounded-2xl font-bold text-xl hover:bg-rose-600 transition shadow-lg">
                                {isActive ? 'DURAKLAT' : 'BAŞLA'}
                            </button>
                            <button onClick={reset} className="bg-slate-200 text-slate-600 px-6 py-4 rounded-2xl font-bold hover:bg-slate-300 transition">
                                <Icon name="rotate-ccw" />
                            </button>
                        </div>
                        <div className="mt-8 flex gap-2 justify-center">
                            <button onClick={()=>{setMode('work'); setTimeLeft(25*60); setIsActive(false);}} className={`px-4 py-2 rounded-xl font-bold ${mode==='work'?'bg-rose-100 text-rose-700':'text-slate-400'}`}>Çalışma (25d)</button>
                            <button onClick={()=>{setMode('break'); setTimeLeft(5*60); setIsActive(false);}} className={`px-4 py-2 rounded-xl font-bold ${mode==='break'?'bg-blue-100 text-blue-700':'text-slate-400'}`}>Mola (5d)</button>
                        </div>
                    </div>
                </div>
            );
        };

        // YENİ ÖZELLİK: P121 Net Hesaplayıcı
        const ScoreCalculator = ({ goBack }) => {
            const [scores, setScores] = useState({
                gygk: { d: 0, y: 0 },
                egitim: { d: 0, y: 0 },
                oabt: { d: 0, y: 0 }
            });

            const calcNet = (d, y) => Math.max(0, d - (y / 4));

            return (
                <div className="h-full flex flex-col items-center p-6 bg-slate-50 anim-fade relative overflow-y-auto">
                    <button onClick={goBack} className="absolute top-6 left-6 bg-white p-3 rounded-full shadow"><Icon name="arrow-left"/></button>
                    <div className="w-full max-w-2xl mt-12 mb-8 text-center">
                        <div className="bg-sky-100 text-sky-600 w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-3 shadow-sm"><Icon name="calculator" size={32}/></div>
                        <h2 className="text-3xl font-black text-slate-800">KPSS & ÖABT Net Hesaplama</h2>
                        <p className="text-slate-500 mt-2 font-medium">Bu sene atanmak için hedeflerini belirle ve analiz et!</p>
                    </div>

                    <div className="w-full max-w-2xl bg-white rounded-3xl shadow-xl border border-slate-100 overflow-hidden mb-12">
                        {['gygk', 'egitim', 'oabt'].map((test) => (
                            <div key={test} className="p-6 border-b border-slate-100 flex items-center justify-between gap-4 flex-wrap">
                                <div className="w-full md:w-auto font-bold text-lg text-slate-700">
                                    {test === 'gygk' ? 'Genel Kültür Yetenek (120 Soru)' : test === 'egitim' ? 'Eğitim Bilimleri (80 Soru)' : 'ÖABT Okul Öncesi (75 Soru)'}
                                </div>
                                <div className="flex gap-4">
                                    <div className="flex flex-col">
                                        <label className="text-xs text-emerald-600 font-bold mb-1">Doğru</label>
                                        <input type="number" min="0" max="120" value={scores[test].d} onChange={e=>setScores({...scores, [test]:{...scores[test], d: parseInt(e.target.value)||0}})} className="w-20 p-2 border-2 border-emerald-200 rounded-xl text-center font-bold outline-none focus:border-emerald-500 bg-emerald-50" />
                                    </div>
                                    <div className="flex flex-col">
                                        <label className="text-xs text-red-600 font-bold mb-1">Yanlış</label>
                                        <input type="number" min="0" max="120" value={scores[test].y} onChange={e=>setScores({...scores, [test]:{...scores[test], y: parseInt(e.target.value)||0}})} className="w-20 p-2 border-2 border-red-200 rounded-xl text-center font-bold outline-none focus:border-red-500 bg-red-50" />
                                    </div>
                                    <div className="flex flex-col justify-end pb-2">
                                        <div className="text-xl font-black text-indigo-600 w-16 text-right">{calcNet(scores[test].d, scores[test].y).toFixed(2)}</div>
                                    </div>
                                </div>
                            </div>
                        ))}
                        
                        <div className="p-8 bg-slate-800 text-white flex justify-between items-center">
                            <div>
                                <div className="text-slate-400 font-bold uppercase tracking-wider text-sm">Tahmini Puan Türü</div>
                                <div className="text-2xl font-black text-amber-400">P121 (ÖABT)</div>
                            </div>
                            <div className="text-right">
                                <div className="text-slate-400 font-bold uppercase tracking-wider text-sm mb-1">Toplam Net</div>
                                <div className="text-4xl font-black">
                                    {(calcNet(scores.gygk.d, scores.gygk.y) + calcNet(scores.egitim.d, scores.egitim.y) + calcNet(scores.oabt.d, scores.oabt.y)).toFixed(2)}
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [view, setView] = useState('dashboard');
            
            // YENİ: Model state'i
            const [modelName, setModelName] = useState(localStorage.getItem('baris_model') || "gemini-2.5-flash-preview-09-2025");
            const [apiKey, setApiKey] = useState(localStorage.getItem('baris_key'));
            
            const [loading, setLoading] = useState(false);
            const [modalData, setModalData] = useState(null); 
            const [quizData, setQuizData] = useState([]);
            const [cardData, setCardData] = useState([]);
            const [errors, setErrors] = useState(JSON.parse(localStorage.getItem('baris_errors')||'[]'));
            const [notebook, setNotebook] = useState(false);

            // Sayaç: 12 Temmuz 2026
            const daysLeft = Math.ceil((new Date('2026-07-12') - new Date()) / (1000 * 60 * 60 * 24));
            useEffect(()=>{localStorage.setItem('baris_errors', JSON.stringify(errors))},[errors]);

            const handleAction = async (type, topic) => {
                if(!apiKey) return alert("Sistem ayarlarından API anahtarını giriniz!");
                if(type==='video') { setModalData({type:'video', topic}); return; }
                setLoading(true);
                try {
                    const prompt = type==='hap' ? `Konu: '${topic}'. KPSS için 5 kritik hap bilgi. HTML <strong>, <em> kullan.`:
                                   type==='ozet' ? `Konu: '${topic}'. ÖABT detaylı özet. HTML <h3>, <strong> kullan.`:
                                   type==='card' ? `Konu: '${topic}'. 10 kart. JSON Array.`:
                                   `Konu: '${topic}'. 10 adet çoktan seçmeli soru hazırla. Zorluk: ÖABT/KPSS. Format: JSON Array olarak şu yapıda olsun: [{"q":"Soru metni","opts":["Seçenek1","Seçenek2","Seçenek3","Seçenek4","Seçenek5"],"ans":0,"exp":"Açıklama"}]. "ans" 0 ile 4 arasında sayı olmalı (0=A, 1=B...). Sadece JSON ver.`;
                    
                    // YENİ: modelName parametresi ile istek atılıyor
                    const res = await callGoogle(apiKey, modelName, prompt + (type==='card'||type==='test'?'': ' HTML formatında ver.'), type==='card'||type==='test'?'json':'html');
                    
                    if(type==='hap'||type==='ozet') setModalData({type:'info', title:topic, content:res});
                    else if(type==='card') { setCardData(res); setView('flashcards'); }
                    else { setQuizData(res); setView('quiz'); }
                } catch(e) { alert("Bir hata oluştu. Lütfen tekrar dene."); console.error(e); } finally { setLoading(false); }
            };

            const startTrial = async (conf) => {
                if(!apiKey) return alert("Sistem ayarlarından API anahtarını giriniz!"); 
                setLoading(true);
                try {
                    const prompt = `KPSS/ÖABT ${conf.type} için ${conf.count} adet zor deneme sorusu. Format: JSON Array [{"q":"...","opts":["..."],"ans":0,"exp":"..."}]. Sadece JSON.`;
                    // YENİ: modelName parametresi ile istek atılıyor
                    const res = await callGoogle(apiKey, modelName, prompt, 'json');
                    setQuizData(res); setView('quiz');
                } catch(e) { alert("Hata."); } finally { setLoading(false); }
            };

            return (
                <div className="h-screen bg-slate-50 text-slate-800 font-sans select-none">
                    {loading && <div className="fixed inset-0 z-[100] bg-white/95 flex flex-col items-center justify-center"><div className="loader mb-6"></div><p className="font-bold text-indigo-600 animate-pulse text-xl">Atanmak İçin Hazırlanıyor...</p></div>}
                    
                    {/* YENİ: notebook bileşenine modelName gönderildi */}
                    {notebook && <SmartNotebook apiKey={apiKey} modelName={modelName} close={()=>setNotebook(false)}/>}
                    {modalData?.type === 'info' && <InfoModal data={modalData} close={()=>setModalData(null)}/>}
                    {modalData?.type === 'video' && <TeacherSelectModal topic={modalData.topic} close={()=>setModalData(null)}/>}

                    {/* YENİ: Dashboard'a model yönetimi prop'ları gönderildi */}
                    {view === 'dashboard' && <Dashboard apiKey={apiKey} setApiKey={setApiKey} modelName={modelName} setModelName={setModelName} changeView={setView} daysLeft={daysLeft} openNotebook={()=>setNotebook(true)}/>}
                    
                    {/* YENİ: Syllabus bileşenine modelName gönderildi */}
                    {view === 'syllabus' && <Syllabus apiKey={apiKey} modelName={modelName} goBack={()=>setView('dashboard')} onAction={handleAction}/>}
                    
                    {view === 'trial_setup' && <TrialSetup goBack={()=>setView('dashboard')} startTrial={startTrial}/>}
                    {view === 'quiz' && <Quiz questions={quizData} goBack={()=>setView('dashboard')} addToErrors={err=>setErrors([err,...errors])} isNotebook={false}/>}
                    {view === 'flashcards' && <Flashcards cards={cardData} goBack={()=>setView('syllabus')}/>}
                    
                    {/* YENİ: Pomodoro ve Net Hesaplama Görünümleri */}
                    {view === 'pomodoro' && <Pomodoro goBack={()=>setView('dashboard')} />}
                    {view === 'calculator' && <ScoreCalculator goBack={()=>setView('dashboard')} />}

                    {view === 'errors' && <div className="h-full p-6 flex flex-col max-w-3xl mx-auto"><div className="flex justify-between items-center mb-6"><button onClick={()=>setView('dashboard')} className="p-3 bg-white rounded-full shadow"><Icon name="arrow-left"/></button><h2 className="font-bold text-2xl text-red-600">Hatalar</h2><button className="bg-white px-4 py-2 font-bold rounded-xl shadow text-slate-500" onClick={()=>setErrors([])}>Temizle</button></div><div className="flex-1 overflow-y-auto space-y-4">{errors.map((e,i)=><div key={i} className="bg-white p-6 rounded-2xl border-l-8 border-red-500 shadow"><div className="font-bold">{e.q}</div><div className="text-red-600">Sen: {e.w}</div><div className="text-emerald-600">Doğru: {e.r}</div><div className="text-sm mt-2">{e.e}</div></div>)}</div></div>}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>

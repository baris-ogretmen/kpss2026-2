    <!-- ===== ZİRVE API KATMANI · şık modal panel + sınırsız görünür anahtar + otomatik model + 503 dayanıklılığı ===== -->
<script>
/* ============================================================
   ZİRVE API KATMANI  ·  çoklu anahtar + otomatik model + teşhis
   Uygulamanın kendi kodu DEĞİŞTİRİLMEDİ. Bu katman fetch'i sarar;
   generativelanguage.googleapis.com'a giden her isteği yakalar,
   anahtarı/modeli kendisi seçer, kota dolunca devreye girer.
   ============================================================ */
(function(){
"use strict";

// ---------- Depolama ----------
const LS = { keys:'zirve_keys', cool:'zirve_keycool', model:'baris_model', rpm:'zirve_rpm', legacy:'baris_key' };
const RING = { keys:[], cool:{}, aktif:null };
let KEY_MODELS = {};   // anahtar -> eriştiği model sayısı (Test Et'te öğrenilir)
try{ const r=localStorage.getItem('zirve_keymodels'); if(r) KEY_MODELS=JSON.parse(r)||{}; }catch(e){}
let MODEL = localStorage.getItem(LS.model) || 'gemini-2.5-flash';
let RPM = parseInt(localStorage.getItem(LS.rpm)||'8',10);

// Kotası kapanmış eski modelleri otomatik yükselt
const OLU_MODELLER = ['gemini-2.0-flash','gemini-2.0-flash-exp','gemini-2.0-flash-lite','gemini-1.5-flash','gemini-1.5-pro','gemini-pro','gemini-exp-1206'];
if (OLU_MODELLER.indexOf(MODEL) !== -1) { MODEL = 'gemini-2.5-flash'; localStorage.setItem(LS.model, MODEL); }

function ringSet(list){ RING.keys = list.map(x=>String(x||'').trim()).filter(k=>k.length>8); }
function ringLoad(){
  try{ const r=localStorage.getItem(LS.keys); if(r) ringSet(JSON.parse(r)); }catch(e){}
  if(!RING.keys.length){ const eski=localStorage.getItem(LS.legacy); if(eski) ringSet([eski]); }
  try{ const c=localStorage.getItem(LS.cool); if(c) RING.cool=JSON.parse(c); }catch(e){}
}
function ringSave(){
  try{
    localStorage.setItem(LS.keys, JSON.stringify(RING.keys));
    localStorage.setItem(LS.cool, JSON.stringify(RING.cool));
    // Uygulamanın kendi kontrolü (if(!apiKey) return) için ilk anahtarı eski yere de yaz
    if(RING.keys[0]) localStorage.setItem(LS.legacy, RING.keys[0]);
  }catch(e){}
}
// Kota Google'da MODEL BAZINDA tutulur → dinlenme kaydı "model|anahtar"
function coolKey(m,k){ return (m||'?')+'|'+k; }
function coolBitis(v){ return (v && typeof v==='object') ? (v.bitis||0) : (v||0); }
function coolGunluk(v){ return (v && typeof v==='object') ? !!v.gunluk : false; }
function ringHazir(m){ const n=Date.now(); return RING.keys.filter(k=>!(coolBitis(RING.cool[coolKey(m,k)])>n)); }
function coolInfo(m,k){ return RING.cool[coolKey(m,k)]; }
function ringPick(m){
  const h=ringHazir(m); if(!h.length) return null;
  if(RING.aktif && h.indexOf(RING.aktif)!==-1) return RING.aktif;
  RING.aktif=h[0]; return RING.aktif;
}
function ringNo(k){ return RING.keys.indexOf(k)+1; }
function ringCool(key, mesaj, m){
  const gunluk = /per day|PerDay|daily|GenerateRequestsPerDay/i.test(String(mesaj||''));
  let ms = 70000;                                  // dakikalık kota → ~70 sn
  if(gunluk){                                      // günlük kota → Pasifik gece yarısına kadar
    const now=new Date();
    const pt=new Date(now.toLocaleString('en-US',{timeZone:'America/Los_Angeles'}));
    const mid=new Date(pt); mid.setHours(24,0,0,0);
    ms=Math.max(60000, mid-pt);
  }
  RING.cool[coolKey(m,key)] = { bitis: Date.now()+ms, gunluk: gunluk }; ringSave();
  return gunluk;
}
function ringBekleme(m){
  const n=Date.now(); let en=Infinity;
  RING.keys.forEach(k=>{ const c=coolBitis(RING.cool[coolKey(m,k)]); if(c>n) en=Math.min(en,c-n); });
  if(en===Infinity) return '';
  const dk=Math.ceil(en/60000);
  return dk>60 ? Math.ceil(dk/60)+' saat' : dk+' dakika';
}

// ---------- Yedek model zinciri ----------
// Tercih sırası (hızlı/bol kotalı → yavaş/kısıtlı). Test Et'e basınca anahtarının
// GERÇEKTEN erişebildiği modeller öğrenilir ve zincir ona göre kurulur; böylece
// var olmayan bir model adına düşmeyiz.
const MODEL_TERCIH = [
  "gemini-2.5-flash-lite", "gemini-flash-lite-latest",
  "gemini-2.5-flash", "gemini-flash-latest",
  "gemini-2.0-flash-lite", "gemini-2.0-flash",
  "gemini-2.5-pro", "gemini-pro-latest"
];
let KULLANILABILIR = [];
try{ const r=localStorage.getItem('zirve_models'); if(r) KULLANILABILIR=JSON.parse(r)||[]; }catch(e){}

function modelHavuzu(){
  if(!KULLANILABILIR.length) return MODEL_TERCIH.slice();
  const havuz = MODEL_TERCIH.filter(m => KULLANILABILIR.indexOf(m)!==-1);
  // Listede olup tercihimizde olmayan flash modelleri de sona ekle (yeni çıkanlar için)
  KULLANILABILIR.forEach(m=>{
    if(havuz.indexOf(m)===-1 && /flash/.test(m) && !/thinking|exp|8b/.test(m)) havuz.push(m);
  });
  return havuz.length ? havuz : MODEL_TERCIH.slice();
}
function modelSonraki(simdiki, denenenler){
  return modelHavuzu().find(m => m!==simdiki && denenenler.indexOf(m)===-1) || null;
}

// ---------- Hız sınırlayıcı (kotayı boşa harcamamak için) ----------
const RL = { calisan:0, maxEs:2, gecmis:[] };
function rpmLimit(){ return RPM; }
async function rateGate(){
  while(true){
    const n=Date.now();
    RL.gecmis = RL.gecmis.filter(t=>n-t<60000);
    if(RL.calisan<RL.maxEs && RL.gecmis.length<rpmLimit()){ RL.calisan++; RL.gecmis.push(n); return; }
    await new Promise(r=>setTimeout(r,250));
  }
}
function rateRelease(){ RL.calisan=Math.max(0,RL.calisan-1); }

// ---------- Model ailesine göre generationConfig düzeltmeleri ----------
function aile(m){
  m=String(m||'');
  if(/gemini-3|gemini-flash-latest|gemini-flash-lite-latest|-latest$/.test(m)) return 'yeni';   // thinkingLevel ister
  if(/2\.5-(flash|flash-lite)/.test(m)) return 'flash25';                                       // thinkingBudget ister
  if(/pro/.test(m)) return 'pro';
  return 'diger';
}
// Gövde dönüşümleri: sırayla denenir, çalışan hatırlanır.
// ASIL ARIZA: Gemini 2.5+ modellerde "düşünme modu" varsayılan AÇIK. responseMimeType:json ve
// maxOutputTokens:16000 ile istek atılınca bütçe düşünmeye gidiyor, JSON YARIDA KESİLİYOR,
// uygulamanın JSON.parse'ı patlıyor ve hata catch{} ile yutulduğu için ekranda hiçbir şey olmuyor.
// Aşağıdaki varyantlar düşünmeyi kapatır/asgariye indirir.
function govdeVaryantlari(m){
  const f=aile(m);
  const temiz=(b)=>{ const c=JSON.parse(JSON.stringify(b)); if(c.generationConfig){ delete c.generationConfig.thinkingConfig; } return c; };
  const dusunme=(b,cfg)=>{ const c=temiz(b); c.generationConfig=Object.assign({}, c.generationConfig, {thinkingConfig:cfg}); return c; };
  // SON ÇARE: responseSchema'yı at. Şema devasa olduğunda model bazen tıkanıyor;
  // uygulamanın promptu istenen JSON biçimini zaten ayrıntısıyla anlatıyor, o yüzden şemasız da çalışır.
  const semasiz=(b,cfg)=>{ const c=dusunme(b,cfg); if(c.generationConfig) delete c.generationConfig.responseSchema; return c; };
  if(f==='yeni') return [
    (b)=>{ const c=dusunme(b,{thinkingLevel:"low"}); delete c.generationConfig.temperature; return c; },
    (b)=>{ const c=semasiz(b,{thinkingLevel:"low"}); delete c.generationConfig.temperature; return c; },
    (b)=>temiz(b), (b)=>b ];
  if(f==='flash25') return [
    (b)=>dusunme(b,{thinkingBudget:0}), (b)=>semasiz(b,{thinkingBudget:0}), (b)=>temiz(b), (b)=>b ];
  if(f==='pro') return [
    (b)=>dusunme(b,{thinkingBudget:128}), (b)=>semasiz(b,{thinkingBudget:128}), (b)=>temiz(b), (b)=>b ];
  return [ (b)=>temiz(b), (b)=>b ];
}
const CFG_OK = {};   // model -> çalıştığı bilinen varyant

// ---------- Zaman aşımlı istek (sonsuz bekleme yok) ----------
const ZAMAN_ASIMI = 150000;   // 150 sn
function fetchZamanAsimli(u, init){
  const ac = new AbortController();
  const t = setTimeout(()=>ac.abort(), ZAMAN_ASIMI);
  return ORIG_FETCH(u, Object.assign({}, init, {signal: ac.signal})).finally(()=>clearTimeout(t));
}

// ---------- Google'ın gerçek hata mesajını oku ----------
async function googleErr(r){
  try{ const d=await r.clone().json(); return (d && d.error && d.error.message) || JSON.stringify(d).slice(0,200); }
  catch(e){ try{ return (await r.clone().text()).slice(0,200); }catch(e2){ return 'HTTP '+r.status; } }
}
// ---------- Türkçe teşhis: sorun anahtarda mı, modelde mi, promptta mı? ----------
function netHatasi(e){
  const m=String((e&&e.message)||e||'');
  if(/TUM_DOLU/i.test(m))
    return 'SORUN: KOTA. Denenen tüm anahtar ve modellerin kotası dolu'+(m.split('·')[1]?' —'+m.split('·')[1]:'')+'. Anahtarların AYNI PROJEDEyse hepsi aynı kotayı paylaşır; ayrı Google Cloud projelerinde anahtar açarsan her biri kendi kotasını alır.';
  if(/SAFETY|blockReason/i.test(m))
    return 'SORUN: PROMPT. İçerik güvenlik filtresine takıldı. Metni yumuşatıp tekrar dene.';
  if(/API key not valid|API_KEY_INVALID|INVALID_ARGUMENT.*key/i.test(m))
    return 'SORUN: ANAHTAR. Anahtar geçersiz. aistudio.google.com/apikey adresinden yeni bir anahtar oluşturup yapıştır.';
  if(/PERMISSION_DENIED|SERVICE_DISABLED|has not been used|is disabled/i.test(m))
    return 'SORUN: ANAHTAR/PROJE. Generative Language API bu projede kapalı ya da anahtarın yetkisi yok. Google AI Studio\'da yeni anahtar oluştur.';
  if(/referer|referrer|API_KEY_HTTP_REFERRER/i.test(m))
    return 'SORUN: ANAHTAR KISITI. Anahtarına web sitesi (HTTP referrer) kısıtı konmuş; dosyayı bilgisayardan açtığın için engelliyor. Anahtar kısıtlamasını "Yok/None" yap.';
  if(/not found|is not supported|Unknown name.*model|models\//i.test(m) && /404|not found|not supported/i.test(m))
    return 'SORUN: MODEL. Bu model adı anahtarınla kullanılamıyor. "Test Et"e bas — çalışan modeli otomatik bulup seçerim.';
  if(/Unknown name|Invalid JSON payload|INVALID_ARGUMENT/i.test(m))
    return 'SORUN: İSTEK BİÇİMİ. Model bu parametreleri kabul etmiyor. Katman otomatik uyarlamayı deniyor; sürerse modeli gemini-2.5-flash yap.';
  if(/50[0234]|UNAVAILABLE|high demand|overloaded|INTERNAL/i.test(m))
    return 'SORUN: GOOGLE TARAFI (503). Model şu an aşırı yoğun. Senin anahtarınla, modelinle ya da yazdığın metinle İLGİSİ YOK — Google\'ın sunucusu geçici olarak dolu. Katman bekleyip tekrar denedi ve sırayla diğer modelleri denedi; hepsi doluysa 2-3 dakika sonra tekrar dene.';
  if(/429|quota|RESOURCE_EXHAUSTED/i.test(m))
    return 'SORUN: KOTA (429). Hız sınırını düşür ya da gemini-2.5-flash-lite dene. Günlük kota Pasifik saatiyle gece yarısı sıfırlanır.';
  if(/aborted|AbortError|zaman aşımı/i.test(m))
    return 'SORUN: SÜRE. Model 150 saniyede yanıt vermedi. Genelde çok uzun materyal istendiğinde olur: istediğin soru/etkinlik sayısını azalt ya da modeli gemini-2.5-flash yap.';
  if(/Failed to fetch|NetworkError|ERR_/i.test(m))
    return 'SORUN: BAĞLANTI. İnternete ulaşılamadı. Reklam engelleyici/VPN/güvenlik duvarı Google\'a erişimi kesiyor olabilir.';
  if(/KESIK_JSON/i.test(m))
    return 'SORUN: ÇIKTI KESİLDİ. Model JSON\'ı tamamlayamadı (istek çok büyük). İstediğin soru/blok sayısını azalt ya da modeli gemini-2.5-flash yap; katman bütçeyi büyütüp tekrar denedi ama yetmedi.';
  if(/BOŞ_YANIT|MAX_TOKENS/i.test(m))
    return 'SORUN: MODEL/ÇIKTI. Model boş ya da kesik yanıt döndü (düşünme modu çıktı bütçesini yiyor). Katman bunu otomatik kapatmayı denedi; sürerse gemini-2.5-flash-lite dene.';
  return m || 'Bilinmeyen hata.';
}

// ---------- Ekrana bildirim ----------
function toast(html, renk){
  let t=document.getElementById('zirve-toast');
  if(!t){
    t=document.createElement('div'); t.id='zirve-toast';
    t.style.cssText='position:fixed;left:50%;transform:translateX(-50%);bottom:86px;z-index:2147483000;max-width:min(560px,92vw);padding:12px 16px;border-radius:14px;font:600 13px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;box-shadow:0 12px 34px rgba(0,0,0,.22);border:2px solid;display:none';
    document.body.appendChild(t);
  }
  t.innerHTML=html; t.style.display='block';
  if(renk==='red'){ t.style.background='#fee2e2'; t.style.borderColor='#fca5a5'; t.style.color='#991b1b'; }
  else if(renk==='green'){ t.style.background='#dcfce7'; t.style.borderColor='#86efac'; t.style.color='#166534'; }
  else { t.style.background='#fffbeb'; t.style.borderColor='#fcd34d'; t.style.color='#92400e'; }
  clearTimeout(toast._t); toast._t=setTimeout(()=>{ t.style.display='none'; }, renk==='red'?14000:9000);
}

// ---------- Anahtar doğrulama + otomatik model bulma ----------
async function listModels(key){
  const r=await ORIG_FETCH(`https://generativelanguage.googleapis.com/v1beta/models?key=${encodeURIComponent(key)}`);
  if(!r.ok) throw new Error(await googleErr(r));
  const d=await r.json();
  return (d.models||[]).filter(m=>(m.supportedGenerationMethods||[]).indexOf('generateContent')!==-1)
                       .map(m=>String(m.name||'').replace('models/',''));
}
function enIyiModel(list){
  const tercih=["gemini-2.5-flash","gemini-2.5-flash-lite","gemini-flash-latest","gemini-flash-lite-latest","gemini-2.5-pro"];
  for(const t of tercih) if(list.indexOf(t)!==-1) return t;
  return list.find(m=>/flash/.test(m)) || list[0] || null;
}

// ============================================================
//  FETCH SARMALAYICI — uygulamanın 15 çağrısı da buradan geçer
// ============================================================
const ORIG_FETCH = window.fetch.bind(window);

function urlBilgi(u){
  const m = /\/v1beta\/models\/([^:?]+)(:generateContent)?/.exec(u);
  return { model: m?m[1]:null, uretim: !!(m&&m[2]) };
}
function urlKur(u, model, key){
  return u.replace(/\/v1beta\/models\/[^:?]+/, '/v1beta/models/'+model)
          .replace(/([?&])key=[^&]*/, '$1key='+encodeURIComponent(key));
}

window.fetch = async function(input, init){
  const u = (typeof input==='string') ? input : (input && input.url) || '';
  // Bizim ilgilendiğimiz istek değilse dokunma
  if(!/generativelanguage\.googleapis\.com/.test(u)) return ORIG_FETCH(input, init);
  if(!RING.keys.length){
    toast('🔑 <b>Önce API anahtarı ekle.</b> Sağ alttaki <b>🔑 API</b> düğmesine bas, anahtarlarını yapıştır ve <b>Test Et</b>e tıkla.','red');
    return ORIG_FETCH(input, init);   // uygulamanın kendi akışı bozulmasın
  }

  const bilgi = urlBilgi(u);
  let model = MODEL || bilgi.model || 'gemini-2.5-flash';
  const denenenModeller = [model];

  // Gövde varyantları yalnızca üretim isteklerinde (POST) anlamlı
  let govdeVar = (init && init.body) ? govdeVaryantlari(model) : [ (b)=>b ];
  let vi = (CFG_OK[model]!==undefined) ? CFG_OK[model] : 0;
  let orjGovde = null;
  if(init && init.body){ try{ orjGovde = JSON.parse(init.body); }catch(e){ orjGovde=null; } }

  const modelDegistir = ()=>{
    const yeni = modelSonraki(model, denenenModeller);
    if(!yeni) return false;
    const eski = model;
    model = yeni; denenenModeller.push(yeni);
    MODEL = yeni; localStorage.setItem(LS.model, yeni);
    if(init && init.body) govdeVar = govdeVaryantlari(model);
    vi = (CFG_OK[model]!==undefined) ? CFG_OK[model] : 0;
    RING.aktif = null;
    panelYenile();
    toast(`⚡ <b>${eski}</b> kotası tüm anahtarlarda doldu → <b>${yeni}</b> modeline geçildi.<br><span style="font-weight:700;font-size:.72rem">Google'da kota her model için ayrı tutulur; taze kotayla devam ediyorsun.</span>`);
    return true;
  };

  let sonHata = null;
  const yogunSayac = {};      // model -> kaç kez 503 aldı
  let bekleme = 900;          // 503 sonrası bekleme (katlanarak artar)
  for(let deneme=0; deneme<40; deneme++){
    const key = ringPick(model);
    if(!key){
      if(modelDegistir()) continue;
      const b = ringBekleme(model);
      const msg = 'TUM_DOLU'+(b?' · en erken '+b+' sonra':'');
      toast('🚫 '+netHatasi(new Error(msg)),'red');
      sonHata = new Error(msg);
      break;
    }
    const yeniUrl = urlKur(u, model, key);
    const yeniInit = Object.assign({}, init);
    if(orjGovde){
      let g = orjGovde;
      try{ g = govdeVar[Math.min(vi,govdeVar.length-1)](orjGovde); }catch(e){ g = orjGovde; }
      yeniInit.body = JSON.stringify(g);
    }

    await rateGate();
    let r;
    try{ r = await fetchZamanAsimli(yeniUrl, yeniInit); }
    catch(e){ rateRelease(); toast('🌐 '+netHatasi(e),'red'); throw e; }
    rateRelease();

    // --- 429: anahtar değiştir, olmazsa model değiştir ---
    if(r.status===429){
      const em = await googleErr(r);
      const eskiNo = ringNo(key);
      const gunluk = ringCool(key, em, model);
      const kalan = ringHazir(model);
      RING.aktif = kalan[0] || null;
      panelYenile();
      if(RING.aktif){
        toast(`🔑 <b>${eskiNo}. anahtarın ${gunluk?'GÜNLÜK':'dakikalık'} kotası doldu</b> → <b>${ringNo(RING.aktif)}. anahtara</b> geçildi.<br><span style="font-weight:700;font-size:.72rem">Hazır anahtar: ${kalan.length}/${RING.keys.length}${gunluk?' · Günlük kota Pasifik gece yarısı sıfırlanır.':''}</span>`);
        continue;
      }
      if(modelDegistir()) continue;
      const b=ringBekleme(model);
      sonHata = new Error('TUM_DOLU'+(b?' · en erken '+b+' sonra':''));
      toast('🚫 '+netHatasi(sonHata),'red');
      break;
    }

    // --- 400: parametre uyumsuzluğu → sonraki gövde varyantı ---
    if(r.status===400 && orjGovde && vi < govdeVar.length-1){ vi++; continue; }

    // --- 503/500/502/504: Google'ın sunucusu yoğun. Anahtarla ilgisi YOK. ---
    if(r.status===503 || r.status===500 || r.status===502 || r.status===504){
      const em = await googleErr(r);
      yogunSayac[model] = (yogunSayac[model]||0)+1;
      if(yogunSayac[model] <= 3){
        const sn = Math.round(bekleme/1000);
        toast(`⏳ <b>Google tarafı yoğun (${r.status})</b> · <b>${model}</b> · ${yogunSayac[model]}/3. deneme, ${sn} sn sonra tekrar...<br><span style="font-weight:700;font-size:.72rem">Bu senin anahtarınla ilgili değil, Google'ın sunucusu geçici olarak dolu. Bekliyorum, sen bir şey yapma.</span>`);
        await new Promise(res=>setTimeout(res, bekleme));
        bekleme = Math.min(9000, Math.round(bekleme*1.8));
        continue;
      }
      if(modelDegistir()){
        bekleme = 900;
        toast(`🔁 <b>${denenenModeller[denenenModeller.length-2]}</b> yoğunluğu geçmedi → <b>${model}</b> modeli deneniyor.`);
        continue;
      }
      sonHata = new Error('HTTP '+r.status+' · '+em);
      toast('⚠️ '+netHatasi(sonHata),'red');
      return r;
    }

    if(!r.ok){
      const em = await googleErr(r);
      sonHata = new Error('HTTP '+r.status+' · '+em);
      toast('⚠️ '+netHatasi(sonHata),'red');
      return r;    // uygulamanın kendi hata akışı çalışsın
    }

    // --- Boş/kesik yanıt: düşünme modu çıktıyı yemiş olabilir ---
    if(orjGovde && bilgi.uretim){
      let d=null; try{ d = await r.clone().json(); }catch(e){}
      const cand = d && d.candidates && d.candidates[0];
      const metin = ((cand && cand.content && cand.content.parts)||[]).map(x=>x.text||'').join('').trim();
      const bitis = cand && cand.finishReason;
      // Çıktı kesildiyse bütçeyi büyüt ve tekrar dene (JSON yarıda kalmasın)
      if(bitis==='MAX_TOKENS' && orjGovde.generationConfig){
        const eskiTok = orjGovde.generationConfig.maxOutputTokens || 8192;
        if(eskiTok < 30000){
          orjGovde.generationConfig.maxOutputTokens = Math.min(32000, Math.round(eskiTok*1.7));
          if(vi < govdeVar.length-1) vi++;
          continue;
        }
      }
      if(!metin){
        const blok = d && d.promptFeedback && d.promptFeedback.blockReason;
        if(!blok && vi < govdeVar.length-1){ vi++; continue; }   // varyant değiştirip tekrar dene
        sonHata = new Error(blok ? ('SAFETY · '+blok) : ('BOŞ_YANIT'+(bitis?' · '+bitis:'')));
        toast('⚠️ '+netHatasi(sonHata),'red');
        return r;
      }
      // JSON istendiyse gerçekten ayrıştırılabiliyor mu? Değilse tekrar dene.
      const jsonIster = orjGovde.generationConfig && orjGovde.generationConfig.responseMimeType==='application/json';
      if(jsonIster){
        let temizMetin = metin.replace(/^```(?:json)?/i,'').replace(/```$/,'').trim();
        let nesne=null; try{ nesne=JSON.parse(temizMetin); }catch(e){ nesne=null; }
        if(nesne===null){
          if(vi < govdeVar.length-1){ vi++; continue; }
          sonHata = new Error('KESIK_JSON');
          toast('⚠️ '+netHatasi(sonHata),'red');
          return r;
        }
        // --- Sertifika, AÇIKÇA istenmedikçe eklenmez ---
        try{
          const istek = JSON.stringify(orjGovde.contents||'');
          const sertifikaIstendi = /sertifika|başarı belgesi|basari belgesi|başarı sertifikası|takdir belgesi/i.test(istek);
          if(!sertifikaIstendi && nesne && Array.isArray(nesne.icerik_bloklari)){
            const once = nesne.icerik_bloklari.length;
            nesne.icerik_bloklari = nesne.icerik_bloklari.filter(b => !b || b.blok_tipi!=='sertifika');
            if(nesne.icerik_bloklari.length !== once && typeof Response!=='undefined'){
              const kopya = JSON.parse(JSON.stringify(d));
              kopya.candidates[0].content.parts = [{text: JSON.stringify(nesne)}];
              CFG_OK[model]=vi;
              return new Response(JSON.stringify(kopya), {status:200, headers:{'Content-Type':'application/json'}});
            }
          }
        }catch(e){}
      }
    }
    CFG_OK[model] = vi;   // çalışan varyantı hatırla
    return r;
  }
  if(sonHata) throw sonHata;
  return ORIG_FETCH(input, init);
};

let ANAHTAR_GOSTER = false;   // anahtarların tamamı görünsün mü
function _sure(ms){
  if(ms<=0) return 'hazır';
  const dk=Math.ceil(ms/60000);
  if(dk<60) return dk+' dk';
  const s=Math.floor(dk/60), k=dk%60;
  return s+' sa'+(k?' '+k+' dk':'');
}
function panelYenile(){
  const mi=document.getElementById('zirve-model');
  if(mi && document.activeElement!==mi) mi.value = MODEL;
  // Özet şeridi
  const ozet=document.getElementById('zirve-ozet');
  const d=document.getElementById('zirve-key-status');

  const n=Date.now();
  if(!RING.keys.length){
    if(ozet) ozet.innerHTML='';
    d.innerHTML='<div style="padding:10px;text-align:center;color:#991b1b;font-weight:800;background:#fef2f2;border-radius:10px">Henüz anahtar yok — yukarıya yapıştır ve Test Et.</div>';
    return;
  }
  // her anahtarın bu modeldeki durumu
  let hazir=0, dolu=0, gunlukDolu=0;
  const satirlar = RING.keys.map((k,i)=>{
    const info = RING.cool[coolKey(MODEL,k)];
    const bitis = coolBitis(info), gunluk = coolGunluk(info);
    const kalanMs = bitis - n;
    const aktifMi = (RING.aktif===k);
    // bu anahtarın kaç modele erişebildiği (testte öğrenildiyse)
    let modelSay = '';
    try{ const mm = (KEY_MODELS && KEY_MODELS[k]); if(mm) modelSay = mm+' model'; }catch(e){}
    if(kalanMs>0){ dolu++; if(gunluk) gunlukDolu++; }
    else hazir++;
    const durumRenk = kalanMs>0 ? (gunluk?'#fde68a':'#fecaca') : '#bbf7d0';
    const durumBg   = kalanMs>0 ? (gunluk?'#fffbeb':'#fef2f2') : '#f0fdf4';
    const rozet = kalanMs>0
        ? `<span style="background:${gunluk?'#f59e0b':'#ef4444'};color:#fff;font-weight:800;font-size:9px;padding:1px 6px;border-radius:999px">${gunluk?'GÜNLÜK DOLDU':'DAKİKALIK'}</span>`
        : `<span style="background:#22c55e;color:#fff;font-weight:800;font-size:9px;padding:1px 6px;border-radius:999px">HAZIR</span>`;
    return `<div style="border:2px solid ${durumRenk};background:${durumBg};border-radius:10px;padding:8px 10px;margin-bottom:6px">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:8px">
        <span style="font-weight:800;font-size:12px">${kalanMs>0?(gunluk?'🟠':'🔴'):'🟢'} ${i+1}. anahtar
<span class="zirve-key-text" data-k="${encodeURIComponent(k)}" style="font-family:ui-monospace,monospace;font-weight:600;opacity:.72;font-size:11px;word-break:break-all;cursor:pointer" title="Tıkla: kopyala">${ANAHTAR_GOSTER ? k : (k.slice(0,7)+'…'+k.slice(-4))}</span>
          ${aktifMi?'<span style="color:#2563eb;font-weight:800;font-size:10px"> ◀ ŞU AN AKTİF</span>':''}
        </span>
        ${rozet}
      </div>
      <div style="display:flex;justify-content:space-between;margin-top:4px;font-size:10.5px;font-weight:700;opacity:.8">
        <span>${modelSay||'&nbsp;'}</span>
        <span>${kalanMs>0 ? ('yenilenme: '+_sure(kalanMs)) : 'kullanıma hazır'}</span>
      </div>
    </div>`;
  }).join('');
  d.innerHTML = satirlar + `<div style="margin-top:6px;font-size:.7rem;font-weight:700;opacity:.65">Durum <b>${MODEL}</b> modeline göre. Kota dolunca katman kendiliğinden sıradaki anahtara/modele geçer.</div>`;
  d.querySelectorAll('.zirve-key-text').forEach(el=>{
    el.onclick=()=>{ try{ const val=decodeURIComponent(el.dataset.k);
      if(navigator.clipboard) navigator.clipboard.writeText(val);
      toast('📋 Anahtar kopyalandı.','green'); }catch(e){} };
  });
  if(ozet){
    ozet.innerHTML = `
      <div style="display:flex;gap:6px;flex-wrap:wrap">
        <span style="background:#dcfce7;color:#166534;font-weight:800;font-size:11px;padding:4px 10px;border-radius:999px">🟢 ${hazir} hazır</span>
        <span style="background:#fee2e2;color:#991b1b;font-weight:800;font-size:11px;padding:4px 10px;border-radius:999px">🔴 ${dolu-gunlukDolu} dakikalık dolu</span>
        <span style="background:#fef3c7;color:#92400e;font-weight:800;font-size:11px;padding:4px 10px;border-radius:999px">🟠 ${gunlukDolu} günlük dolu</span>

      </div>`;
  }
}

async function testEt(){
  const out=document.getElementById('zirve-test-out');
  const ta=document.getElementById('zirve-keys');
  ringSet(ta.value.split(/[\n,;]+/));
  RING.aktif=null; ringSave();
  if(!RING.keys.length){ out.innerHTML='<b style="color:#991b1b">Anahtar girmedin.</b>'; return; }
  out.innerHTML='⏳ Her anahtar tek tek deneniyor...';
  const satir=[]; const gecerli=[]; let modeller=null;
  for(let i=0;i<RING.keys.length;i++){
    const k=RING.keys[i];
    try{
      const list=await listModels(k);
      gecerli.push(k); if(!modeller) modeller=list;
      KEY_MODELS[k]=list.length;
      satir.push(`<div style="color:#166534;font-weight:700">✅ ${i+1}. anahtar geçerli · ${list.length} model erişilebilir</div>`);
    }catch(e){
      satir.push(`<div style="color:#991b1b;font-weight:700">❌ ${i+1}. anahtar: ${netHatasi(e)}</div>`);
    }
  }
  if(gecerli.length && modeller){
    KULLANILABILIR = modeller.slice();
    try{ localStorage.setItem('zirve_models', JSON.stringify(modeller)); localStorage.setItem('zirve_keymodels', JSON.stringify(KEY_MODELS)); }catch(e){}
    const havuz = modelHavuzu();
    satir.push(`<div style="color:#166534;font-weight:700">🔁 Yedek model zinciri kuruldu (${havuz.length} model): ${havuz.slice(0,4).join(' → ')}${havuz.length>4?' → …':''}</div>`);
    const secili=document.getElementById('zirve-model').value.trim();
    if(!secili || modeller.indexOf(secili)===-1){
      const iyi=enIyiModel(modeller);
      if(iyi){ MODEL=iyi; localStorage.setItem(LS.model,iyi); document.getElementById('zirve-model').value=iyi;
        satir.push(`<div style="color:#1d4ed8;font-weight:800">⚡ Model otomatik seçildi: ${iyi}</div>`); }
    } else { MODEL=secili; localStorage.setItem(LS.model,secili); }
    const dl=document.getElementById('zirve-model-list');
    if(dl) dl.innerHTML = modeller.map(m=>`<option value="${m}">`).join('');
    if(gecerli.length>=2){
      satir.push(`<div style="color:#92400e;font-weight:700;margin-top:4px">ℹ️ Not: Google'da kota <b>anahtar başına değil, PROJE başına</b>dır. Anahtarların aynı projedeyse aynı kotayı paylaşır; ayrı projelerde açarsan her biri kendi kotasını alır.</div>`);
    }
  }
  out.innerHTML = satir.join('');
  ringSave(); panelYenile();
  if(gecerli.length){
    toast(`✅ <b>${gecerli.length}/${RING.keys.length} anahtar çalışıyor · model: ${MODEL}</b><br><span style="font-weight:700;font-size:.72rem">Sayfa yenileniyor, ardından tüm AI özellikleri açık olacak.</span>`,'green');
    setTimeout(()=>location.reload(), 2200);
  }
}

       const callGoogle = async (apiKey, modelName, prompt, type = 'json', retries = 3) => {
    const url = `https://generativelanguage.googleapis.com/v1beta/models/${modelName}:generateContent?key=${apiKey}`;
    try {
        const response = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] }) });
        const data = await response.json();
        
        if (data.error) {
            if (data.error.message.includes("demand") && retries > 0) {
                console.warn(`Google Sunucuları Dolu. Arka planda tekrar deneniyor... Kalan hak: ${retries}`);
                await new Promise(r => setTimeout(r, 2500));
                return callGoogle(apiKey, modelName, prompt, type, retries - 1);
            }
            throw new Error(data.error.message);
        }
        
        let text = data.candidates?.[0]?.content?.parts?.[0]?.text;
        if (!text) throw new Error("Cevap boş döndü.");
        
        if (type === 'html') {
            return text.replace(/```html/g, '').replace(/```/g, '').trim();
        }
        
        text = text.replace(/```json/g, '').replace(/```/g, '').trim();
        const s = text.indexOf('['); const e = text.lastIndexOf(']');
        if (s !== -1 && e !== -1) text = text.substring(s, e+1);
        return JSON.parse(text);
    } catch (e) { 
        console.error("Yapay Zeka Hatası:", e); 
        throw new Error(e.message); 
    }
};

                                                <button onClick={()=>onAction('hap',t)} className="bg-white border-2 border-amber-200 text-amber-700 py-3 rounded-xl font-bold flex items-center justify-center gap-2 hover:bg-amber-500 hover:text-white transition"><Icon name="pill" size={18}/> HAP</button>
                                                <button onClick={()=>onAction('ozet',t)} className="bg-white border-2 border-blue-200 text-blue-700 py-3 rounded-xl font-bold flex items-center justify-center gap-2 hover:bg-blue-500 hover:text-white transition"><Icon name="file-text" size={18}/> ÖZET</button>
                                                <button onClick={()=>onAction('card',t)} className="bg-white border-2 border-purple-200 text-purple-700 py-3 rounded-xl font-bold flex items-center justify-center gap-2 hover:bg-purple-500 hover:text-white transition"><Icon name="layers" size={18}/> KART</button>
                                                <button onClick={()=>onAction('test',t)} className="bg-white border-2 border-emerald-200 text-emerald-700 py-3 rounded-xl font-bold flex items-center justify-center gap-2 hover:bg-emerald-500 hover:text-white transition"><Icon name="check-circle" size={18}/> SORU</button>
                                                <button onClick={()=>onAction('video',t)} className="col-span-2 md:col-span-4 bg-red-50 text-red-600 py-2 rounded-xl text-sm font-bold border border-red-200 flex items-center justify-center gap-2 hover:bg-red-500 hover:text-white transition"><Icon name="youtube" size={16}/> Konu Anlatım Videoları</button>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            );
        };

        // ... (SmartNotebook, InfoModal, TeacherSelect, TrialSetup, Quiz, Flashcards - V47/48 ile aynı, sadece App'e entegre)
        
        const SmartNotebook = ({ apiKey, modelName, close }) => {
            const [notes, setNotes] = useState(localStorage.getItem('baris_notebook') || "");
            const [processing, setProcessing] = useState(false);
            const [quizFromNotes, setQuizFromNotes] = useState(null);
            const handleSave = (val) => { setNotes(val); localStorage.setItem('baris_notebook', val); };
            const polish = async () => { if(!notes.trim()) return; setProcessing(true); try { const res = await callGoogle(apiKey, modelName, `Düzelt:\n${notes}`, 'html'); handleSave(res.replace(/<[^>]*>?/gm, '')); alert("Düzenlendi!"); } catch(e){} finally { setProcessing(false); } };
            const genQuiz = async () => { 
                if(!notes.trim()) return; 
                setProcessing(true); 
                try { 
                    const prompt = `Metin: "${notes}". Bu metinden 5 adet çoktan seçmeli soru hazırla. Format: JSON Array olarak şu yapıda olsun: [{"q":"Soru","opts":["A","B","C","D","E"],"ans":0,"exp":"Açıklama"}]. Sadece JSON ver.`;
                    const res = await callGoogle(apiKey, modelName, prompt, 'json'); 
                    setQuizFromNotes(res); 
                } catch(e){ alert("Hata oluştu."); } finally { setProcessing(false); } 
            };
            if(quizFromNotes) return <div className="fixed inset-0 z-[90] bg-white"><Quiz questions={quizFromNotes} goBack={()=>setQuizFromNotes(null)} addToErrors={()=>{}} isNotebook={true}/></div>;
            return <div className="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4 backdrop-blur-sm anim-fade" onClick={close}><div className="bg-white w-full max-w-3xl h-[85vh] rounded-3xl shadow-2xl flex flex-col overflow-hidden" onClick={e=>e.stopPropagation()}><div className="p-4 bg-amber-400 text-amber-950 font-bold flex justify-between items-center"><span className="flex items-center gap-2"><Icon name="edit-3"/> Not Defterim</span><button onClick={close}><Icon name="x"/></button></div><textarea value={notes} onChange={e=>handleSave(e.target.value)} className="flex-1 p-6 bg-amber-50 resize-none outline-none text-lg text-slate-700 leading-relaxed font-medium" placeholder="Buraya yaz..."></textarea><div className="p-3 bg-white border-t flex gap-2"><button onClick={polish} disabled={processing} className="flex-1 bg-indigo-100 text-indigo-700 py-3 rounded-xl font-bold flex items-center justify-center gap-2"><Icon name="wand-2"/> Düzenle</button><button onClick={genQuiz} disabled={processing} className="flex-1 bg-emerald-100 text-emerald-700 py-3 rounded-xl font-bold flex items-center justify-center gap-2"><Icon name="brain-circuit"/> Soru Üret</button></div></div></div>;
        };

        const InfoModal = ({ data, close }) => (
            <div className="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4 backdrop-blur-sm anim-fade" onClick={close}>
                <div className="bg-white w-full max-w-2xl max-h-[85vh] rounded-3xl p-8 shadow-2xl overflow-y-auto relative" onClick={e=>e.stopPropagation()}>
                    <button onClick={close} className="absolute top-4 right-4 bg-slate-100 p-2 rounded-full hover:bg-slate-200"><Icon name="x"/></button>
                    <h2 className="text-2xl font-black mb-6 text-indigo-700 border-b pb-2">{data.title}</h2>
                    <div className="prose prose-lg prose-slate readable-text" dangerouslySetInnerHTML={{__html: data.content}}></div>
                </div>
            </div>
        );

        const TeacherSelectModal = ({ topic, close }) => {
            const cat = topic.includes('Tarih')?'Tarih':topic.includes('Coğrafya')?'Coğrafya':topic.includes('Vatandaşlık')?'Vatandaşlık':topic.includes('Matematik')?'Matematik':topic.includes('Gelişim')||topic.includes('Öğrenme')||topic.includes('Rehberlik')?'Eğitim':'ÖABT';
            return (
                <div className="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4 backdrop-blur-sm anim-fade" onClick={close}>
                    <div className="bg-white w-full max-w-sm rounded-3xl p-6 shadow-2xl" onClick={e=>e.stopPropagation()}>
                        <h3 className="font-bold text-xl mb-4 text-red-600 flex items-center gap-2"><Icon name="youtube"/> Hoca Seç</h3>
                        <div className="space-y-2">
                            {INSTRUCTORS[cat]?.map(h=><button key={h} onClick={()=>window.open(`https://www.youtube.com/results?search_query=${encodeURIComponent(h+" "+topic)}`,'_blank')} className="w-full p-4 bg-slate-50 hover:bg-red-50 text-left rounded-xl font-bold text-slate-700 hover:text-red-600 transition border border-slate-100">{h}</button>)}
                            <button onClick={()=>window.open(`https://www.youtube.com/results?search_query=KPSS+${encodeURIComponent(topic)}`,'_blank')} className="w-full p-4 border-2 border-dashed border-slate-300 text-slate-400 font-bold rounded-xl">Genel Arama</button>
                        </div>
                        <button onClick={close} className="w-full mt-6 bg-slate-100 py-3 rounded-xl font-bold text-slate-500">Kapat</button>
                    </div>
                </div>
            );
        };

        const TrialSetup = ({ goBack, startTrial }) => {
            const [config, setConfig] = useState({ type: 'OABT', count: 20 });
            return (
                <div className="h-full flex flex-col justify-center p-6 bg-slate-50 anim-fade">
                    <button onClick={goBack} className="absolute top-6 left-6 bg-white p-3 rounded-full shadow"><Icon name="arrow-left"/></button>
                    <div className="bg-white p-10 rounded-[2.5rem] shadow-2xl max-w-lg mx-auto w-full border border-slate-100">
                        <div className="text-center mb-8"><h2 className="text-3xl font-black text-slate-800">Deneme Oluştur</h2></div>
                        <div className="space-y-3 mb-8">{[{id:'OABT', l:'ÖABT Alan'}, {id:'AGS', l:'AGS Genel'}, {id:'EGITIM', l:'Eğitim Bil.'}].map(opt=><button key={opt.id} onClick={()=>setConfig({...config, type:opt.id})} className={`w-full p-5 rounded-2xl text-left font-bold transition border-2 ${config.type===opt.id ? 'border-indigo-500 bg-indigo-50 text-indigo-700' : 'border-slate-100 text-slate-500'}`}>{opt.l}</button>)}</div>
                        <div className="flex justify-between gap-3 mb-8">{[10, 20, 30, 50].map(n=><button key={n} onClick={()=>setConfig({...config, count:n})} className={`flex-1 py-4 rounded-xl font-bold transition ${config.count===n?'bg-emerald-500 text-white shadow-lg':'bg-slate-100 text-slate-400'}`}>{n}</button>)}</div>
                        <button onClick={()=>startTrial(config)} className="w-full bg-indigo-600 text-white py-5 rounded-2xl font-bold text-xl shadow-xl hover:bg-indigo-700 transition active:scale-95">BAŞLAT</button>
                    </div>
                </div>
            );
        };

        const Quiz = ({ questions, goBack, addToErrors, isNotebook }) => {
            const [idx, setIdx] = useState(0);
            const [show, setShow] = useState(false);
            const [score, setScore] = useState(0);
            const q = questions[idx];
            
            const handleAns = (i) => { 
                if(show) return; 
                setShow(true); 
                if(i===q.ans) setScore(score+1); 
                else addToErrors({q:q.q, w:q.opts[i], r:q.opts[q.ans], e:q.exp, t: isNotebook?"Defter":"Deneme"}); 
            };

            return (
                <div className="h-full flex flex-col bg-slate-50 p-6 anim-fade">
                    <div className="flex justify-between items-center mb-6">
                        <button onClick={goBack} className="text-slate-400 font-bold">Çıkış</button>
                        <div className="bg-white px-4 py-2 rounded-full font-bold shadow-sm text-indigo-600">{idx+1}/{questions.length}</div>
                    </div>
                    <div className="flex-1 overflow-y-auto">
                        <div className="bg-white p-8 rounded-3xl shadow-md border border-slate-100 mb-6">
                            <p className="font-bold text-xl text-slate-800 leading-relaxed">{q.q}</p>
                        </div>
                        <div className="space-y-4">
                            {q.opts.map((o,i)=>
                                <button key={i} onClick={()=>handleAns(i)} disabled={show} className={`w-full text-left p-5 rounded-2xl border-2 font-medium text-lg transition ${show?(i===q.ans?'border-emerald-500 bg-emerald-50 text-emerald-800':i!==q.ans&&'opacity-50'):'border-white bg-white hover:border-indigo-200'}`}>
                                    {o}
                                </button>
                            )}
                        </div>
                        
                        {/* YENİ: KONU ÖZETİ VE BANKO UYARISI */}
                        {show && (
                            <div className="mt-8 space-y-4 anim-fade">
                                <div className={`p-6 border-2 rounded-3xl ${q.isBanko ? 'bg-rose-50 border-rose-200' : 'bg-indigo-50 border-indigo-200'}`}>
                                    <div className={`font-black text-lg mb-3 flex items-center gap-2 ${q.isBanko ? 'text-rose-700' : 'text-indigo-700'}`}>
                                        <Icon name={q.isBanko ? 'alert-octagon' : 'lightbulb'}/> 
                                        {q.isBanko ? '🚨 DİKKAT! ÖSYM KESİN SORAR (BANKO BİLGİ)' : '💡 Çözüm & Detay'}
                                    </div>
                                    <div className="text-slate-800 font-medium mb-4">{q.exp}</div>
                                    {q.summary && (
                                        <div className="p-4 bg-white/60 rounded-xl text-sm border border-black/5 text-slate-700">
                                            <strong className="text-slate-900">📌 Kısa Konu Özeti:</strong> {q.summary}
                                        </div>
                                    )}
                                </div>
                            </div>
                        )}
                    </div>
                    {show && <button onClick={()=>{if(idx<questions.length-1){setIdx(idx+1);setShow(false)}else{alert(`Sınav Bitti! Puan: ${score}`);goBack()}}} className="w-full bg-indigo-600 text-white py-5 rounded-2xl font-bold mt-4 shadow-xl text-lg hover:bg-indigo-700 active:scale-95 transition">İleri</button>}
                </div>
            );
        };

        const Flashcards = ({ cards, goBack }) => {
            const [idx, setIdx] = useState(0);
            const [flipped, setFlipped] = useState(false);
            return (
                <div className="h-full flex flex-col bg-slate-100 p-6 anim-fade">
                    <div className="flex justify-between items-center mb-8"><button onClick={goBack} className="p-3 bg-white rounded-full shadow"><Icon name="x"/></button><span className="font-bold text-indigo-600 bg-white px-4 py-2 rounded-full shadow">{idx+1}/{cards.length}</span></div>
                    <div className="flex-1 w-full max-w-md mx-auto perspective-1000 mb-8" onClick={()=>setFlipped(!flipped)}><div className={`relative w-full h-full transition-transform duration-700 transform-style-3d cursor-pointer ${flipped?'rotate-y-180':''}`}><div className="absolute w-full h-full backface-hidden bg-white rounded-[2rem] shadow-2xl flex flex-col items-center justify-center p-10 border-b-8 border-indigo-500"><span className="text-xs font-black text-slate-300 uppercase tracking-widest mb-6">SORU</span><div className="text-3xl font-bold text-center text-slate-800">{cards[idx].front}</div></div><div className="absolute w-full h-full backface-hidden rotate-y-180 bg-gradient-to-br from-indigo-600 to-purple-700 text-white rounded-[2rem] shadow-2xl flex flex-col items-center justify-center p-10"><span className="text-xs font-black text-indigo-200 uppercase tracking-widest mb-6">CEVAP</span><div className="text-2xl font-medium text-center leading-relaxed">{cards[idx].back}</div></div></div></div>
                    <div className="flex gap-4 max-w-md mx-auto w-full"><button onClick={()=>{setIdx(Math.max(0,idx-1));setFlipped(false)}} disabled={idx===0} className="flex-1 bg-white py-4 rounded-2xl font-bold">Geri</button><button onClick={()=>{setIdx(Math.min(cards.length-1,idx+1));setFlipped(false)}} disabled={idx===cards.length-1} className="flex-1 bg-indigo-600 text-white py-4 rounded-2xl font-bold">İleri</button></div>
                </div>
            );
        };

       const App = () => {
            const [view, setView] = useState('dashboard');
            const [apiKey, setApiKey] = useState(localStorage.getItem('baris_key'));
            const [loading, setLoading] = useState(false);
            const [modalData, setModalData] = useState(null); 
            const [quizData, setQuizData] = useState([]);
            const [cardData, setCardData] = useState([]);
            const [errors, setErrors] = useState(JSON.parse(localStorage.getItem('baris_errors')||'[]'));
            const [notebook, setNotebook] = useState(false);
            
            // Barış Hoca'nın Motivasyon Deposu
            const motivasyonSozleri = [
                "Özel sektörü geride bırakacağın o güzel günlere çok az kaldı Barış Hocam!",
                "Bugün çözdüğün her soru, yarınki atanma kararnamendir.",
                "Yorulmak yok! O atama ekranında 'Yerleştirildiniz' yazısını göreceğiz.",
                "KPSS bir zeka sınavı değil, sabır sınavıdır. Sabreden kazanır!",
                "Şu an zor geliyor biliyorum, ama o sınıfın kapısından kadrolu öğretmen olarak gireceksin."
            ];
            const [quote, setQuote] = useState(motivasyonSozleri[0]);

            const getSelectedModel = () => localStorage.getItem('baris_model') || "gemini-2.5-flash";

            
            const targetDate = new Date('2026-07-26T00:00:00+03:00');
            const currentDate = new Date();
            const daysLeft = Math.max(0, Math.ceil((targetDate - currentDate) / (1000 * 60 * 60 * 24)));
            
            useEffect(()=>{localStorage.setItem('baris_errors', JSON.stringify(errors))},[errors]);

            const handleSearch = async (term) => {
                if(!apiKey) return alert("Anahtar giriniz!");
                if(!term.trim()) return;
                setLoading(true);
                try {
                    const prompt = `Sen KPSS 2026 ÖABT uzmanısın. Aranan terim: '${term}'. SADECE HTML FORMATINDA (Markdown kullanmadan) çok renkli, akılda kalıcı bir KAVRAM HARİTASI oluştur. <h3>, <p>, <ul>, <li>, <strong>, <em>, <mark> ve <table> etiketlerini bolca kullan. Mutlaka bir 'Hafıza Çivisi' (akılda kalıcı kodlama/kısaltma) veya 'ÖSYM Kesin Sorar' tablosu ekle. Metin siyah-beyaz ve sıkıcı olmasın, emojilerle destekle.`;
                    const res = await callGoogle(apiKey, getSelectedModel(), prompt, 'html');
                    setModalData({type:'info', title: `🔎 Arama Sonucu: ${term}`, content: res});
                } catch(e) {
                    alert("Arama başarısız oldu. Lütfen tekrar dene.");
                } finally { setLoading(false); }
            };

            const handleAction = async (type, topic) => {
                if(!apiKey) return alert("Anahtar giriniz!");
                if(type==='video') { setModalData({type:'video', topic}); return; }
                setLoading(true);
                try {
                    const prompt = type==='hap' ? `Konu: '${topic}'. KPSS/ÖABT için en kritik 5 bilgiyi HTML formatında ver. Sıkıcı metin olmasın! <mark>, <strong>, <em> ve <table> etiketleri kullanarak renkli, emojili ve hafıza çivili (kodlamalı) bir liste yap. Asla Markdown kullanma.` :
                                   type==='ozet' ? `Konu: '${topic}'. KPSS/ÖABT için çok net ve detaylı bir özet çıkar. SADECE HTML formatında ver. Bolca <mark> (vurgu), <strong>, <em> ve karşılaştırma için <table> kullan. Bir bölüm mutlaka 'ÖSYM Nasıl Sorar? (Hafıza Teknikleri)' olsun. Emojiler kullan. Markdown yasak.` :
                                   type==='card' ? `Konu: '${topic}'. Sınavda sorulabilecek 10 adet çalışma kartı hazırla. SADECE JSON ARRAY GÖNDER. Başka kelime yazma. Format: [{"front":"Kavram Adı","back":"Açıklaması"}]` :
                                   `Konu: '${topic}'. Tam KPSS zorluğunda 10 adet çoktan seçmeli soru yaz. SADECE JSON GÖNDER. Format: [{"q":"Soru metni","opts":["A) ","B) ","C) ","D) ","E) "],"ans":0,"exp":"Doğru yanıt açıklaması","summary":"Hafıza çivili çok kısa konu özeti","isBanko":true veya false}]`;
                    
                    const res = await callGoogle(apiKey, getSelectedModel(), prompt, type==='card'||type==='test'?'json':'html');
                    
                    if(type==='hap'||type==='ozet') setModalData({type:'info', title:topic, content:res});
                    else if(type==='card') { setCardData(res); setView('flashcards'); }
                    else { setQuizData(res); setView('quiz'); }
                } catch(e) { 
                    alert("Barış Hocam Bir Hata Oluştu!\n\nSistemin Söylediği Neden:\n" + e.message); 
                    console.error(e); 
                } finally { setLoading(false); }
            };

            const startTrial = async (conf) => {
                if(!apiKey) return alert("Anahtar giriniz!"); setLoading(true);
                setQuote(motivasyonSozleri[Math.floor(Math.random() * motivasyonSozleri.length)]);
                try {
                    const prompt = `KPSS/ÖABT ${conf.type} alanı için zor ${conf.count} adet deneme sorusu hazırla. SADECE JSON GÖNDER. Format: [{"q":"Soru metni","opts":["A) ","B) ","C) ","D) ","E) "],"ans":0,"exp":"Açıklama","summary":"Konu özeti","isBanko":true veya false}]`;
                    const res = await callGoogle(apiKey, getSelectedModel(), prompt, 'json');
                    setQuizData(res); setView('quiz');
                } catch(e) { 
                    alert("Sorular hazırlanırken bir bağlantı koptu. Lütfen tekrar 'Başlat'a bas."); 
                } finally { setLoading(false); }
            };

            return (
                <div className="h-screen bg-slate-50 text-slate-800 font-sans select-none">
                    {loading && (
                        <div className="fixed inset-0 z-[100] bg-white/95 flex flex-col items-center justify-center p-6 text-center">
                            <div className="loader mb-6"></div>
                            <p className="font-black text-indigo-600 text-2xl mb-4">Barış Hocam İçin Hazırlanıyor...</p>
                            <p className="text-slate-500 font-bold text-lg max-w-md">"{quote}"</p>
                            <span className="text-xs text-indigo-300 mt-4 uppercase tracking-widest">Model: {getSelectedModel()} | Aktif Key: {apiKey ? apiKey.substring(0,8) + "..." : "Girilmedi"}</span>
                        </div>
                    )}
                    
                    {notebook && <SmartNotebook apiKey={apiKey} modelName={getSelectedModel()} close={()=>setNotebook(false)}/>}
                    {modalData?.type === 'info' && <InfoModal data={modalData} close={()=>setModalData(null)}/>}
                    {modalData?.type === 'video' && <TeacherSelectModal topic={modalData.topic} close={()=>setModalData(null)}/>}

                    {/* DİKKAT: Arama motoru bağlantısı buraya eklendi (onSearch) */}
                    {view === 'dashboard' && <Dashboard apiKey={apiKey} setApiKey={setApiKey} changeView={setView} daysLeft={daysLeft} openNotebook={()=>setNotebook(true)} onSearch={handleSearch}/>}
                    
                    {view === 'syllabus' && <Syllabus apiKey={apiKey} modelName={getSelectedModel()} goBack={()=>setView('dashboard')} onAction={handleAction}/>}
                    {view === 'trial_setup' && <TrialSetup goBack={()=>setView('dashboard')} startTrial={startTrial}/>}
                    {view === 'quiz' && <Quiz questions={quizData} goBack={()=>setView('dashboard')} addToErrors={err=>setErrors([err,...errors])} isNotebook={false}/>}
                    {view === 'flashcards' && <Flashcards cards={cardData} goBack={()=>setView('syllabus')}/>}
                    {view === 'errors' && <div className="h-full p-6 flex flex-col max-w-3xl mx-auto"><div className="flex justify-between items-center mb-6"><button onClick={()=>setView('dashboard')}><Icon name="arrow-left"/></button><h2 className="font-bold text-2xl text-red-600">Hatalar</h2><button onClick={()=>setErrors([])}>Temizle</button></div><div className="flex-1 overflow-y-auto space-y-4">{errors.map((e,i)=><div key={i} className="bg-white p-6 rounded-2xl border-l-8 border-red-500 shadow"><div className="font-bold">{e.q}</div><div className="text-red-600">Sen: {e.w}</div><div className="text-emerald-600">Doğru: {e.r}</div><div className="text-sm mt-2">{e.e}</div></div>)}</div></div>}
                </div>
            );
        };
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>

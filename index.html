<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Barış Akademi - V49 (Renkli & Numaralı)</title>
    
    <!-- React & ReactDOM -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.development.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.development.min.js"></script>
    
    <!-- Babel -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Fredoka:wght@500;600&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Outfit', sans-serif; background-color: #f8fafc; color: #1e293b; margin: 0; overflow: hidden; }
        .brand { font-family: 'Fredoka', sans-serif; }
        .hide-scroll::-webkit-scrollbar { display: none; }
        
        /* Loader */
        .loader { border: 4px solid #e2e8f0; border-top: 4px solid #6366f1; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        /* Animations */
        .anim-fade { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        
        /* Renkli vurgular ve Metin Stilleri */
        .readable-text strong { color: #4f46e5; font-weight: 800; }
        .readable-text em { background-color: #fef08a; color: #854d0e; font-style: normal; padding: 0 4px; border-radius: 4px; font-weight: 600; }
        .readable-text ul { list-style-type: disc; padding-left: 1.5rem; margin-bottom: 1rem; }
        .readable-text h3 { color: #1e293b; font-size: 1.25rem; font-weight: 800; margin-top: 1.5rem; margin-bottom: 0.5rem; border-bottom: 2px solid #e2e8f0; padding-bottom: 0.25rem; }
        .readable-text table { width: 100%; border-collapse: separate; border-spacing: 0; margin-top: 1rem; border-radius: 12px; overflow: hidden; border: 1px solid #e2e8f0; }
        .readable-text th, .readable-text td { padding: 12px; text-align: left; border-bottom: 1px solid #e2e8f0; }
        .readable-text th { background-color: #f8fafc; font-weight: 800; color: #334155; border-right: 1px solid #e2e8f0; }
        .readable-text td { border-right: 1px solid #e2e8f0; }
        .readable-text tr:last-child td { border-bottom: none; }
        
        /* Kart Stili (Flashcard) */
        .perspective-1000 { perspective: 1000px; }
        .transform-style-3d { transform-style: preserve-3d; }
        .backface-hidden { backface-visibility: hidden; }
        .rotate-y-180 { transform: rotateY(180deg); }

        /* Chat Widget Animations */
        .chat-enter { animation: slideInUp 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
        @keyframes slideInUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        
        /* Audio Player Animation */
        .audio-wave { display: flex; align-items: center; gap: 3px; height: 20px; }
        .audio-bar { width: 3px; background-color: #4f46e5; animation: wave 1s ease-in-out infinite; }
        .audio-bar:nth-child(2) { animation-delay: 0.1s; height: 60%; }
        .audio-bar:nth-child(3) { animation-delay: 0.2s; height: 80%; }
        .audio-bar:nth-child(4) { animation-delay: 0.3s; height: 50%; }
        @keyframes wave { 0%, 100% { height: 40%; } 50% { height: 100%; } }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // Varsayılan Model
        const DEFAULT_MODEL = "gemini-2.5-flash-preview-09-2025";
        const TTS_MODEL = "gemini-2.5-flash-preview-tts";

        // --- TAM LİSTE MÜFREDAT (NUMARALI) ---
        const CURRICULUM = {
            OABT_ALAN: {
                title: "ÖABT Okul Öncesi Alan Bilgisi",
                color: "rose", // Kırmızı/Pembe Tema
                units: [
                    {
                        id: 1, title: "Erken Çocukluk Eğitimine Giriş", 
                        topics: ["1.1. EÇE Tanımı, Amacı ve İlkeleri", "1.2. Tarihsel Süreç ve Düşünürler", "1.3. Türkiye'de Okul Öncesi Eğitim", "1.4. Kuramlar ve Yaklaşımlar"]
                    },
                    {
                        id: 2, title: "Çocuk Sağlığı ve İlkyardım", 
                        topics: ["2.1. Sağlık Ölçütleri ve Büyüme", "2.2. Anne ve Çocuk Sağlığı", "2.3. Temel İlkyardım Uygulamaları", "2.4. Çocuk Hastalıkları ve Aşılar"]
                    },
                    {
                        id: 3, title: "Erken Çocuklukta Gelişim", 
                        topics: ["3.1. Fiziksel ve Motor Gelişim", "3.2. Bilişsel Gelişim", "3.3. Dil Gelişimi", "3.4. Sosyal ve Duygusal Gelişim", "3.5. Kişilik ve Ahlak Gelişimi", "3.6. Cinsel Gelişim"]
                    },
                    {
                        id: 4, title: "Çocuk Ruh Sağlığı", 
                        topics: ["4.1. Ruh Sağlığı Tanımı ve Kuramlar", "4.2. Bağlanma ve Uyum Problemleri", "4.3. Davranış ve Alışkanlık Bozuklukları", "4.4. Özel Gereksinimli Çocuklar"]
                    },
                    {
                        id: 5, title: "Erken Çocukluk Dönemi Edebiyatı", 
                        topics: ["5.1. Çocuk Edebiyatı Tanımı ve Önemi", "5.2. Edebi Türler (Masal, Hikaye vb.)", "5.3. Kitap Seçimi ve Nitelikleri"]
                    },
                    {
                        id: 6, title: "Anne-Baba Eğitimi", 
                        topics: ["6.1. Aile Eğitimi Modelleri", "6.2. Aile Katılımı Çalışmaları", "6.3. Anne-Baba Tutumları"]
                    },
                    {
                        id: 7, title: "Çocuk Hakları", 
                        topics: ["7.1. Çocuk Hakları Sözleşmesi", "7.2. Çocuk Hukuku ve Koruma", "7.3. İhmal ve İstismar"]
                    }
                ]
            },
            OABT_EGITIM: {
                title: "ÖABT Okul Öncesi Alan Eğitimi",
                color: "amber", // Turuncu/Sarı Tema
                units: [
                    {
                        id: 1, title: "Alan Eğitimi Temelleri", 
                        topics: ["1.1. Okul Öncesinde Fen Eğitimi", "1.2. Okul Öncesinde Matematik Eğitimi", "1.3. Okul Öncesinde Görsel Sanatlar", "1.4. Okul Öncesinde Müzik Eğitimi"]
                    },
                    {
                        id: 2, title: "Oyun ve Drama", 
                        topics: ["2.1. Oyun Gelişimi ve Kuramları", "2.2. Yaratıcı Drama Aşamaları ve Teknikleri"]
                    },
                    {
                        id: 3, title: "Program ve Planlama", 
                        topics: ["3.1. Okula Uyum ve Erken Okuryazarlık", "3.2. Öğrenme Yaklaşımları ve Programlar", "3.3. Materyal Geliştirme"]
                    }
                ]
            },
            AGS: {
                title: "Akademi Giriş Sınavı (AGS)",
                color: "sky", // Mavi Tema
                units: [
                    {
                        id: 1, title: "Sözel Yetenek", 
                        topics: ["1.1. Sözcükte Anlam", "1.2. Cümlede Anlam", "1.3. Paragrafta Anlam", "1.4. Sözel Mantık"]
                    },
                    {
                        id: 2, title: "Sayısal Yetenek", 
                        topics: ["2.1. Temel Matematik", "2.2. Problemler", "2.3. Sayısal Mantık", "2.4. Grafik ve Tablo Yorumlama"]
                    },
                    {
                        id: 3, title: "Tarih", 
                        topics: ["3.1. İslamiyet Öncesi Türk Tarihi", "3.2. Türk-İslam Tarihi", "3.3. Osmanlı Tarihi", "3.4. İnkılap Tarihi", "3.5. Çağdaş Türk ve Dünya Tarihi"]
                    },
                    {
                        id: 4, title: "Coğrafya", 
                        topics: ["4.1. Türkiye Fiziki Coğrafyası", "4.2. Türkiye Beşeri Coğrafyası", "4.3. Türkiye Ekonomik Coğrafyası"]
                    },
                    {
                        id: 5, title: "Eğitim Bilimleri", 
                        topics: ["5.1. Gelişim Psikolojisi", "5.2. Öğrenme Psikolojisi", "5.3. Öğretim Yöntem ve Teknikleri", "5.4. Ölçme ve Değerlendirme", "5.5. Program Geliştirme", "5.6. Rehberlik"]
                    },
                    {
                        id: 6, title: "Mevzuat", 
                        topics: ["6.1. Temel Hukuk ve Anayasa", "6.2. 1739 Sayılı Milli Eğitim Temel Kanunu", "6.3. 222 Sayılı İlköğretim Kanunu", "6.4. Öğretmenlik Mesleği Kanunu"]
                    }
                ]
            }
        };

        const INSTRUCTORS = {
            'Tarih': ['Ramazan Yetgin', 'Aydın Yüce', 'Mehmet Celal Özyıldız'],
            'Coğrafya': ['Bayram Meral', 'Engin Eraydın'],
            'Vatandaşlık': ['Emrah Vahap Özkaraca'],
            'Matematik': ['İlyas Güneş'],
            'Eğitim': ['Metin Şar', 'Bülent Tanık', 'Cüneyt İltuş', 'Fatih Genç'],
            'ÖABT': ['Hilal Hoca', 'Okul Öncesi ÖABT TV', 'Sultan Hoca', 'Murat Sakin']
        };

        const Icon = ({ name, size=20, className="" }) => {
            useEffect(() => { 
                if(window.lucide) window.lucide.createIcons(); 
            });
            return <i data-lucide={name} className={className} style={{ width: size, height: size, display: 'inline-block' }}></i>;
        };

        const callGoogle = async (apiKey, modelName, input, type = 'json') => {
            const url = `https://generativelanguage.googleapis.com/v1beta/models/${modelName}:generateContent?key=${apiKey}`;
            const contents = Array.isArray(input) ? input : [{ parts: [{ text: input }] }];

            try {
                const response = await fetch(url, { 
                    method: 'POST', 
                    headers: { 'Content-Type': 'application/json' }, 
                    body: JSON.stringify({ contents }) 
                });
                
                const data = await response.json();
                if (data.error) throw new Error(data.error.message);
                
                let text = data.candidates?.[0]?.content?.parts?.[0]?.text;
                if (!text) throw new Error("Cevap boş.");
                
                if (type === 'html' || type === 'text') return text;
                
                text = text.replace(/```json/g, '').replace(/```/g, '').trim();
                const s = text.indexOf('['); const e = text.lastIndexOf(']');
                if (s !== -1 && e !== -1) text = text.substring(s, e+1);
                
                return JSON.parse(text);
            } catch (e) { console.error(e); throw e; }
        };

        const callTTS = async (apiKey, textToSay) => {
            const url = `https://generativelanguage.googleapis.com/v1beta/models/${TTS_MODEL}:generateContent?key=${apiKey}`;
            const payload = {
                contents: [{ parts: [{ text: textToSay }] }],
                generationConfig: {
                    responseModalities: ["AUDIO"],
                    speechConfig: { voiceConfig: { prebuiltVoiceConfig: { voiceName: "Kore" } } }
                }
            };
            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await response.json();
                if (data.error) throw new Error(data.error.message);
                return data.candidates?.[0]?.content?.parts?.[0]?.inlineData?.data;
            } catch (e) { console.error(e); throw e; }
        };

        // --- COMPONENTS ---

        const AICoach = ({ apiKey, modelName }) => {
            const [isOpen, setIsOpen] = useState(false);
            const [messages, setMessages] = useState([{ role: 'model', text: 'Merhaba Hocam! Ben Barış AI Koç. Çalışma programı, motivasyon ya da takıldığın bir konu... Ne konuşalım? 👋' }]);
            const [input, setInput] = useState("");
            const [loading, setLoading] = useState(false);
            const scrollRef = useRef(null);

            useEffect(() => { if(scrollRef.current) scrollRef.current.scrollTop = scrollRef.current.scrollHeight; }, [messages, isOpen]);

            const sendMessage = async () => {
                if(!input.trim() || !apiKey) return;
                const userMsg = input.trim();
                setMessages(prev => [...prev, { role: 'user', text: userMsg }]);
                setInput("");
                setLoading(true);

                const history = messages.map(m => ({ role: m.role, parts: [{ text: m.text }] }));
                history.push({ role: 'user', parts: [{ text: userMsg + " (Lütfen bir eğitim koçu gibi, pozitif, motive edici ve kısa cevap ver. Emojileri kullan.)" }] });

                try {
                    const res = await callGoogle(apiKey, modelName, history, 'text');
                    setMessages(prev => [...prev, { role: 'model', text: res }]);
                } catch(e) { setMessages(prev => [...prev, { role: 'model', text: "Bağlantı hatası oluştu." }]); } finally { setLoading(false); }
            };

            return (
                <div className="fixed bottom-6 right-6 z-[60] flex flex-col items-end pointer-events-none">
                    {isOpen && (
                        <div className="pointer-events-auto bg-white w-80 md:w-96 h-[500px] rounded-3xl shadow-2xl border border-indigo-100 flex flex-col overflow-hidden chat-enter mb-4">
                            <div className="bg-indigo-600 p-4 text-white flex justify-between items-center">
                                <div className="flex items-center gap-2"><div className="bg-white/20 p-2 rounded-full"><Icon name="bot" size={20}/></div><span className="font-bold">Barış AI Koç</span></div>
                                <button onClick={()=>setIsOpen(false)} className="hover:bg-white/20 p-1 rounded-full"><Icon name="x" size={18}/></button>
                            </div>
                            <div className="flex-1 overflow-y-auto p-4 bg-slate-50 space-y-3" ref={scrollRef}>
                                {messages.map((m, i) => (<div key={i} className={`flex ${m.role === 'user' ? 'justify-end' : 'justify-start'}`}><div className={`max-w-[85%] p-3 rounded-2xl text-sm font-medium ${m.role === 'user' ? 'bg-indigo-500 text-white rounded-br-none' : 'bg-white border border-slate-200 text-slate-700 rounded-bl-none shadow-sm'}`}>{m.text}</div></div>))}
                                {loading && <div className="flex justify-start"><div className="bg-slate-200 p-3 rounded-2xl rounded-bl-none animate-pulse text-xs text-slate-500">Yazıyor...</div></div>}
                            </div>
                            <div className="p-3 bg-white border-t flex gap-2">
                                <input value={input} onChange={e=>setInput(e.target.value)} onKeyDown={e=>e.key==='Enter' && sendMessage()} placeholder="Bir şeyler yaz..." className="flex-1 bg-slate-100 rounded-xl px-3 py-2 text-sm outline-none focus:ring-2 ring-indigo-500/50"/>
                                <button onClick={sendMessage} disabled={loading} className="bg-indigo-600 text-white p-2 rounded-xl hover:bg-indigo-700 disabled:opacity-50"><Icon name="send" size={18}/></button>
                            </div>
                        </div>
                    )}
                    <button onClick={()=>setIsOpen(!isOpen)} className="pointer-events-auto bg-indigo-600 hover:bg-indigo-700 text-white p-4 rounded-full shadow-xl hover:scale-105 transition flex items-center justify-center gap-2 group">
                        {isOpen ? <Icon name="chevron-down"/> : <Icon name="message-circle-code"/>}
                        {!isOpen && <span className="font-bold hidden group-hover:block pr-2 transition-all">AI Koç</span>}
                    </button>
                </div>
            );
        };

        const HistoryChat = ({ apiKey, goBack }) => {
            const [selectedFigure, setSelectedFigure] = useState(null);
            const [messages, setMessages] = useState([]);
            const [input, setInput] = useState("");
            const [loading, setLoading] = useState(false);
            const scrollRef = useRef(null);

            const figures = [
                { name: 'Mustafa Kemal Atatürk', role: 'Kurucu Lider & Başöğretmen', icon: 'award' },
                { name: 'Fatih Sultan Mehmet', role: 'Osmanlı Padişahı', icon: 'castle' },
                { name: 'Mimar Sinan', role: 'Başmimar', icon: 'pencil-ruler' },
                { name: 'Jean Piaget', role: 'Gelişim Psikoloğu', icon: 'brain-circuit' },
                { name: 'Lev Vygotsky', role: 'Öğrenme Kuramcısı', icon: 'users' }
            ];

            useEffect(() => { if(scrollRef.current) scrollRef.current.scrollTop = scrollRef.current.scrollHeight; }, [messages]);

            const startChat = (fig) => {
                setSelectedFigure(fig);
                setMessages([{ role: 'model', text: `Merhaba! Ben ${fig.name}. Sana nasıl yardımcı olabilirim?` }]);
            };

            const sendMessage = async () => {
                if(!input.trim() || !apiKey) return;
                const userMsg = input.trim();
                setMessages(prev => [...prev, { role: 'user', text: userMsg }]);
                setInput("");
                setLoading(true);

                const prompt = `Sen ${selectedFigure.name}'sin. Karşındaki bir öğrenci. Seninle konuşuyor. Kendi döneminin bilgisi, üslubu, kelime dağarcığı ve bakış açısıyla cevap ver. Asla rolden çıkma. Kısa, öz ve öğretici cevap ver. Soru: "${userMsg}"`;

                try {
                    const res = await callGoogle(apiKey, DEFAULT_MODEL, prompt, 'text');
                    setMessages(prev => [...prev, { role: 'model', text: res }]);
                } catch(e) { setMessages(prev => [...prev, { role: 'model', text: "Bağlantı koptu..." }]); } finally { setLoading(false); }
            };

            return (
                <div className="h-full bg-slate-50 p-6 flex flex-col anim-fade">
                    <div className="flex items-center gap-4 mb-6">
                        <button onClick={goBack} className="bg-white p-3 rounded-full shadow hover:bg-slate-100"><Icon name="arrow-left"/></button>
                        <h2 className="text-2xl font-black text-slate-800">Tarihsel Sohbet</h2>
                    </div>

                    {!selectedFigure ? (
                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 max-w-5xl mx-auto w-full">
                            {figures.map(f => (
                                <button key={f.name} onClick={()=>startChat(f)} className="bg-white p-6 rounded-3xl shadow-lg border-2 border-transparent hover:border-indigo-500 hover:shadow-indigo-100 transition group flex items-center gap-4 text-left">
                                    <div className="bg-indigo-100 text-indigo-600 p-4 rounded-2xl group-hover:scale-110 transition"><Icon name={f.icon} size={32}/></div>
                                    <div>
                                        <div className="font-bold text-lg text-slate-800">{f.name}</div>
                                        <div className="text-sm text-slate-500">{f.role}</div>
                                    </div>
                                </button>
                            ))}
                        </div>
                    ) : (
                        <div className="flex-1 bg-white rounded-3xl shadow-xl border border-slate-100 flex flex-col overflow-hidden max-w-4xl mx-auto w-full">
                            <div className="bg-indigo-600 p-4 text-white flex justify-between items-center">
                                <div className="font-bold text-lg flex items-center gap-2"><Icon name="message-circle"/> {selectedFigure.name} ile Sohbet</div>
                                <button onClick={()=>setSelectedFigure(null)} className="text-sm bg-white/20 px-3 py-1 rounded-lg hover:bg-white/30">Bitir</button>
                            </div>
                            <div className="flex-1 overflow-y-auto p-6 bg-slate-50 space-y-4" ref={scrollRef}>
                                {messages.map((m, i) => (
                                    <div key={i} className={`flex ${m.role === 'user' ? 'justify-end' : 'justify-start'}`}>
                                        <div className={`max-w-[80%] p-4 rounded-2xl text-lg ${m.role === 'user' ? 'bg-indigo-600 text-white rounded-br-none' : 'bg-white border-2 border-indigo-100 text-slate-800 rounded-bl-none shadow-sm'}`}>
                                            {m.text}
                                        </div>
                                    </div>
                                ))}
                                {loading && <div className="flex justify-start"><div className="bg-slate-200 p-4 rounded-2xl rounded-bl-none animate-pulse text-slate-500">Düşünüyor...</div></div>}
                            </div>
                            <div className="p-4 bg-white border-t flex gap-3">
                                <input value={input} onChange={e=>setInput(e.target.value)} onKeyDown={e=>e.key==='Enter' && sendMessage()} placeholder={`${selectedFigure.name} kişisine bir soru sor...`} className="flex-1 bg-slate-100 rounded-2xl px-6 py-4 text-lg outline-none focus:ring-2 ring-indigo-500/50"/>
                                <button onClick={sendMessage} disabled={loading} className="bg-indigo-600 text-white px-8 rounded-2xl hover:bg-indigo-700 disabled:opacity-50 font-bold"><Icon name="send"/></button>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const QuestionSolver = ({ apiKey, goBack }) => {
            const [question, setQuestion] = useState("");
            const [result, setResult] = useState(null);
            const [loading, setLoading] = useState(false);

            const solve = async () => {
                if(!question.trim() || !apiKey) return;
                setLoading(true);
                try {
                    const prompt = `Sen uzman bir KPSS öğretmenisin. Öğrenci sana şu soruyu sordu: "${question}". 
                    1. Önce sorunun ne sorduğunu ve soru kökünü analiz et. 
                    2. Doğru cevabı adım adım mantık yürüterek bul. 
                    3. Diğer şıkların neden yanlış olduğunu (çeldirici analizi) açıkla.
                    Cevabı şu HTML formatında ver: <div class="space-y-6"><div><h4 class="font-bold text-indigo-700 text-lg border-b border-indigo-100 pb-2 mb-2">🔍 Soru Analizi</h4><p class="text-slate-700">...</p></div><div><h4 class="font-bold text-emerald-600 text-lg border-b border-emerald-100 pb-2 mb-2">✅ Doğru Cevap & Çözüm</h4><p class="text-slate-700">...</p></div><div><h4 class="font-bold text-red-600 text-lg border-b border-red-100 pb-2 mb-2">❌ Çeldirici Analizi</h4><p class="text-slate-700">...</p></div></div>`;
                    const res = await callGoogle(apiKey, DEFAULT_MODEL, prompt, 'html');
                    setResult(res);
                } catch(e) { alert("Hata oluştu."); } finally { setLoading(false); }
            };

            return (
                <div className="h-full bg-slate-50 p-6 flex flex-col anim-fade">
                    <div className="flex items-center gap-4 mb-6">
                        <button onClick={goBack} className="bg-white p-3 rounded-full shadow hover:bg-slate-100"><Icon name="arrow-left"/></button>
                        <h2 className="text-2xl font-black text-slate-800">Soru Çözüm Sihirbazı</h2>
                    </div>

                    <div className="grid grid-cols-1 lg:grid-cols-2 gap-6 h-full overflow-hidden">
                        <div className="bg-white p-6 rounded-3xl shadow-xl border border-slate-100 flex flex-col h-full">
                            <div className="mb-4">
                                <label className="block text-sm font-bold text-slate-700 mb-2">Sorunu Buraya Yapıştır</label>
                                <textarea value={question} onChange={e=>setQuestion(e.target.value)} className="w-full h-64 p-4 bg-slate-50 border-2 border-slate-200 rounded-xl outline-none focus:border-indigo-500 transition resize-none text-lg" placeholder="Soru metnini buraya yaz..."></textarea>
                            </div>

        const StudyPlanner = ({ apiKey, goBack }) => {

            const [feedback, setFeedback] = useState(null);

            const startInterview = async () => {

            };

                setLoading(true);
                try {
                    const prompt = `Soru: "${question}". Adayın Cevabı: "${answer}". Bu cevabı bir mülakat komisyonu üyesi gibi değerlendir. 100 üzerinden puan ver. Eksikleri ve iyi yönleri nazikçe açıkla. HTML formatında ver.`;
                    const res = await callGoogle(apiKey, DEFAULT_MODEL, prompt, 'html');
                    setFeedback(res);
                    setStep(2);
                } catch(e) { alert("Hata oluştu."); } finally { setLoading(false); }

            return (
                <div className="h-full bg-slate-50 p-6 flex flex-col anim-fade">

        const MatchingGame = ({ cards, goBack }) => {
            const [shuffledCards, setShuffledCards] = useState([]);
            const [selected, setSelected] = useState([]);
            const [matched, setMatched] = useState([]);

            useEffect(() => {
                const gameCards = [];
                cards.forEach((pair, i) => {
                    gameCards.push({ id: `t-${i}`, content: pair.term, type: 'term', pairId: i });
                    gameCards.push({ id: `d-${i}`, content: pair.def, type: 'def', pairId: i });
                });
                setShuffledCards(gameCards.sort(() => Math.random() - 0.5));
            }, [cards]);

            const handleCardClick = (card) => {
                if (matched.includes(card.id) || selected.find(c => c.id === card.id) || selected.length >= 2) return;
                const newSelected = [...selected, card];
                setSelected(newSelected);
                if (newSelected.length === 2) {
                    if (newSelected[0].pairId === newSelected[1].pairId) { setMatched(prev => [...prev, newSelected[0].id, newSelected[1].id]); setSelected([]); } 
                    else { setTimeout(() => setSelected([]), 1000); }
                }
            };

            const isWin = matched.length === shuffledCards.length && shuffledCards.length > 0;

            return (
                <div className="h-full bg-slate-100 p-6 flex flex-col anim-fade">
                    <div className="flex items-center justify-between mb-6"><button onClick={goBack} className="bg-white p-3 rounded-full shadow hover:bg-slate-100"><Icon name="arrow-left"/></button><h2 className="text-2xl font-black text-slate-800">Kavram Eşleştirme</h2><div className="bg-white px-4 py-2 rounded-xl font-bold text-indigo-600 shadow">{matched.length / 2} / {shuffledCards.length / 2}</div></div>
                    {isWin ? (
                        <div className="flex-1 flex flex-col items-center justify-center text-center"><div className="text-8xl mb-4 animate-bounce">🎉</div><h2 className="text-4xl font-black text-indigo-700 mb-4">TEBRİKLER!</h2><p className="text-slate-600 text-xl mb-8">Tüm kavramları başarıyla eşleştirdin.</p><button onClick={goBack} className="bg-indigo-600 text-white px-8 py-3 rounded-xl font-bold text-lg hover:bg-indigo-700">Tamamla</button></div>
                    ) : (
                        <div className="grid grid-cols-2 md:grid-cols-3 gap-4 auto-rows-fr h-full overflow-y-auto pb-20">
                            {shuffledCards.map(card => {
                                const isSelected = selected.find(c => c.id === card.id);
                                const isMatched = matched.includes(card.id);
                                let bgClass = "bg-white border-slate-200 text-slate-700 hover:border-indigo-300";
                                if (isSelected) bgClass = "bg-indigo-100 border-indigo-500 text-indigo-800 scale-95 ring-2 ring-indigo-200";
                                if (isMatched) bgClass = "bg-emerald-100 border-emerald-500 text-emerald-800 opacity-50";
                                return (<button key={card.id} onClick={() => handleCardClick(card)} className={`p-4 rounded-xl border-2 font-bold text-sm md:text-base flex items-center justify-center text-center transition-all duration-300 shadow-sm ${bgClass}`}>{card.content}</button>);
                            })}
                        </div>
                    )}
                </div>
            );
        };

        // YENİ ÖZELLİK: Kavram Karşılaştırıcı (Comparison Tool)

                                <div className="text-slate-400 font-black text-xl">VS</div>

        // YENİ ÖZELLİK: Güncel Bilgiler (Current Events)
        const CurrentEvents = ({ apiKey, goBack }) => {

                    <div className="w-full grid grid-cols-1 md:grid-cols-2 gap-4 mb-8">

                        <button onClick={()=>changeView('current_events')} className="bg-white p-5 rounded-3xl shadow-lg border-2 border-transparent hover:border-rose-500 hover:shadow-rose-100 transition group flex flex-col items-center gap-3"><div className="bg-rose-100 text-rose-600 p-3 rounded-2xl group-hover:scale-110 transition"><Icon name="globe" size={28}/></div><span className="font-bold text-slate-700">Güncel</span></button>
                        <button onClick={()=>changeView('history_chat')} className="bg-white p-5 rounded-3xl shadow-lg border-2 border-transparent hover:border-orange-500 hover:shadow-orange-100 transition group flex flex-col items-center gap-3"><div className="bg-orange-100 text-orange-600 p-3 rounded-2xl group-hover:scale-110 transition"><Icon name="scroll-text" size={28}/></div><span className="font-bold text-slate-700">Tarihsel</span></button>
                        <button onClick={()=>changeView('interview')} className="bg-white p-5 rounded-3xl shadow-lg border-2 border-transparent hover:border-cyan-500 hover:shadow-cyan-100 transition group flex flex-col items-center gap-3"><div className="bg-cyan-100 text-cyan-600 p-3 rounded-2xl group-hover:scale-110 transition"><Icon name="mic" size={28}/></div><span className="font-bold text-slate-700">Mülakat</span></button>
                        <button onClick={()=>changeView('trial_setup')} className="bg-white p-5 rounded-3xl shadow-lg border-2 border-transparent hover:border-emerald-500 hover:shadow-emerald-100 transition group flex flex-col items-center gap-3"><div className="bg-emerald-100 text-emerald-600 p-3 rounded-2xl group-hover:scale-110 transition"><Icon name="file-badge" size={28}/></div><span className="font-bold text-slate-700">Deneme</span></button>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [view, setView] = useState('dashboard');
            const [apiKey, setApiKey] = useState(localStorage.getItem('baris_key'));
            const [loading, setLoading] = useState(false);
            const [modalData, setModalData] = useState(null); 
            const [quizData, setQuizData] = useState([]);
            const [cardData, setCardData] = useState([]);
            const [errors, setErrors] = useState(JSON.parse(localStorage.getItem('baris_errors')||'[]'));
            const [notebook, setNotebook] = useState(false);
            const daysLeft = Math.ceil((new Date('2026-07-12') - new Date()) / (1000 * 60 * 60 * 24));
            
            useEffect(()=>{localStorage.setItem('baris_errors', JSON.stringify(errors))},[errors]);

            const handleAction = async (type, topic) => {
                if(!apiKey) return alert("Anahtar giriniz!");
                if(type==='video') { setModalData({type:'video', topic}); return; }
                
                setLoading(true);
                try {
                    // TTS İşlemi
                    if (type === 'tts') {
                        const textPrompt = `Konu: '${topic}'. Bu konuyu bir öğrenciye anlatır gibi, samimi, akıcı ve net bir dille özetle. Çok uzun olmasın (max 2 paragraf). Konuşma dili kullan.`;
                        const textToSay = await callGoogle(apiKey, DEFAULT_MODEL, textPrompt, 'text');
                        const audioBase64 = await callTTS(apiKey, textToSay);
                        setModalData({type:'audio', title: `${topic} - Sesli Anlatım`, content: audioBase64});
                        setLoading(false);
                        return;
                    }

                    let prompt = "";
                    let resType = "html";
                    if (type === 'analyze') prompt = `Konu: '${topic}'. Bu konuyu KPSS/ÖABT öğrencisi için analiz et. HTML formatında şu başlıkları doldur: <div class="space-y-4"><div><h4 class="font-bold text-indigo-600 text-lg">📊 Zorluk & Süre</h4><p class="text-slate-600">Zorluk derecesi (1-10 üzerinden) ve tahmini çalışma saati.</p></div><div><h4 class="font-bold text-red-600 text-lg">⚠️ En Çok Karıştırılanlar</h4><p class="text-slate-600">Bu konuda öğrencilerin sık yaptığı hatalar ve çeldiriciler.</p></div><div><h4 class="font-bold text-emerald-600 text-lg">💡 ÖSYM Ne Sorar?</h4><p class="text-slate-600">Sınavda çıkma ihtimali yüksek soru tarzları.</p></div></div>`;
                    else if (type === 'hap') prompt = `Konu: '${topic}'. KPSS sınavı için en önemli 5 kritik bilgiyi maddeler halinde, akılda kalıcı şekilde yaz. HTML formatında (<ul>, <li>, <strong>, <em>) ver.`;
                    else if (type === 'hafiza') prompt = `Konu: '${topic}'. KPSS için bu konuyu ezberlemeyi kolaylaştıracak yaratıcı bir hikaye, akrostiş veya kodlama (mnemonik) tekniği oluştur. Eğlenceli ve akılda kalıcı olsun. HTML formatında (<strong>, <em>) ver.`;
                    else if (type === 'ozet') prompt = `Konu: '${topic}'. Bu konuyu ÖABT/KPSS detayında, akademik ama anlaşılır bir dille özetle. Önemli yerleri <strong> ile vurgula. Alt başlıklar için <h3> kullan. HTML formatında ver.`;
                    else if (type === 'card' || type === 'game') { 
                        // Oyun için de kart formatı kullanıyoruz, JSON alıp oyuna yönlendireceğiz
                        prompt = `Konu: '${topic}'. Bu konudaki en önemli 6 terim ve bunların kısa tanımlarını eşleştirme oyunu için hazırla. JSON formatında: [{"term": "Terim", "def": "Kısa Tanım"}]`; 
                        resType = "json"; 
                    }
                    else if (type === 'test') { prompt = `Konu: '${topic}'. KPSS formatında, zorlayıcı 10 adet çoktan seçmeli soru hazırla. JSON formatında: [{"q":"Soru metni","opts":["A şıkkı","B şıkkı"...],"ans":0 (doğru şıkkın indexi),"exp":"Detaylı açıklama"}]`; resType = "json"; }
                    else if (type === 'eli5') prompt = `Konu: '${topic}'. Bu konuyu 5 yaşındaki bir çocuğun bile anlayabileceği kadar basitleştirerek anlat. Eğlenceli olsun. Emojiler kullan. HTML formatında ver.`;
                    else if (type === 'motivation') prompt = `KPSS'ye çalışan bir öğrenci için çok kısa, esprili, samimi ve gaza getirici bir günün sözü söyle. Emojilerle süsle. HTML formatında ver.`;
                    
                    const res = await callGoogle(apiKey, DEFAULT_MODEL, prompt, resType);
                    
                    if(['hap','ozet','eli5','motivation','analyze','hafiza'].includes(type)) setModalData({type:'info', title: type==='analyze' ? '📊 Konu Analizi' : type==='eli5' ? '👶 5 Yaşında Gibi Anlat' : type==='motivation' ? '✨ Günün Motivasyonu' : type==='hafiza' ? '🧠 Hafıza Teknikleri' : topic, content:res});
                    else if(type==='card') { setCardData(res); setView('flashcards'); }
                    else if(type==='game') { setCardData(res); setView('game'); } // Oyuna yönlendir
                    else { setQuizData(res); setView('quiz'); }
                } catch(e) { alert("Hata oluştu."); } finally { setLoading(false); }
            };

            const startTrial = async (conf) => {
                if(!apiKey) return alert("Anahtar giriniz!"); setLoading(true);
                try {
                    const prompt = `KPSS/ÖABT ${conf.type} sınavı için ${conf.count} adet, sınav formatına uygun deneme sorusu hazırla. JSON: [{"q":"...","opts":["..."],"ans":0,"exp":"..."}].`;
                    const res = await callGoogle(apiKey, DEFAULT_MODEL, prompt, 'json');
                    setQuizData(res); setView('quiz');
                } catch(e) { alert("Hata oluştu."); } finally { setLoading(false); }
            };

            return (
                <div className="h-screen bg-slate-50 text-slate-800 font-sans select-none overflow-hidden relative">
                    {loading && <div className="fixed inset-0 z-[100] bg-white/95 flex flex-col items-center justify-center"><div className="loader mb-6"></div><p className="font-bold text-indigo-600 animate-pulse text-xl">Yapay Zeka Hazırlıyor... ✨</p></div>}
                    
                    {apiKey && <AICoach apiKey={apiKey} modelName={DEFAULT_MODEL} />}
                    {notebook && <SmartNotebook apiKey={apiKey} modelName={DEFAULT_MODEL} close={()=>setNotebook(false)}/>}
                    {modalData?.type === 'info' || modalData?.type === 'audio' ? <InfoModal data={modalData} close={()=>setModalData(null)}/> : null}
                    {modalData?.type === 'video' && <TeacherSelectModal topic={modalData.topic} close={()=>setModalData(null)}/>}

                    {view === 'dashboard' && <Dashboard apiKey={apiKey} setApiKey={setApiKey} changeView={setView} daysLeft={daysLeft} openNotebook={()=>setNotebook(true)} onMotivation={()=>handleAction('motivation', 'Genel')} />}
                    {view === 'syllabus' && <Syllabus apiKey={apiKey} modelName={DEFAULT_MODEL} goBack={()=>setView('dashboard')} onAction={handleAction}/>}
                    {view === 'planner' && <StudyPlanner apiKey={apiKey} goBack={()=>setView('dashboard')}/>}
                    {view === 'question_solver' && <QuestionSolver apiKey={apiKey} goBack={()=>setView('dashboard')}/>}
                    {view === 'history_chat' && <HistoryChat apiKey={apiKey} goBack={()=>setView('dashboard')}/>}
                    {view === 'interview' && <InterviewCoach apiKey={apiKey} goBack={()=>setView('dashboard')}/>}
                    {view === 'comparison' && <ComparisonTool apiKey={apiKey} goBack={()=>setView('dashboard')}/>}
                    {view === 'current_events' && <CurrentEvents apiKey={apiKey} goBack={()=>setView('dashboard')}/>}
                    {view === 'game' && <MatchingGame cards={cardData} goBack={()=>setView('syllabus')}/>}
                    {view === 'trial_setup' && <TrialSetup goBack={()=>setView('dashboard')} startTrial={startTrial}/>}
                    {view === 'quiz' && <Quiz questions={quizData} goBack={()=>setView('dashboard')} addToErrors={err=>setErrors([err,...errors])} isNotebook={false}/>}
                    {view === 'flashcards' && <Flashcards cards={cardData} goBack={()=>setView('syllabus')}/>}
                    {view === 'errors' && <div className="h-full p-6 flex flex-col max-w-3xl mx-auto"><div className="flex justify-between items-center mb-6"><button onClick={()=>setView('dashboard')}><Icon name="arrow-left"/></button><h2 className="font-bold text-2xl text-red-600">Hatalar</h2><button onClick={()=>setErrors([])}>Temizle</button></div><div className="flex-1 overflow-y-auto space-y-4">{errors.map((e,i)=><div key={i} className="bg-white p-6 rounded-2xl border-l-8 border-red-500 shadow"><div className="font-bold">{e.q}</div><div className="text-red-600">Sen: {e.w}</div><div className="text-emerald-600">Doğru: {e.r}</div><div className="text-sm mt-2">{e.e}</div></div>)}</div></div>}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
